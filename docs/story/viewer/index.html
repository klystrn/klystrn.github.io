<style>
/* Layout: a storyboard room — scene index on the left wall, the board for one scene on the table.
   Chrome is graphite/ivory like the Story itself; sketches are always on drawing paper. */
:root {
  --bg: #f1ede4;          /* room, light */
  --surface: #fbf9f4;
  --line: #d8d1c3;
  --ink: #1d1b19;
  --muted: #6b645a;
  --crimson: #b3121f;
  --crimson-soft: #f4dcdc;
  --teal: #1f7a78;
  --gold: #9a7420;
  --paper: #f6f1e6;       /* sketch paper — same in both themes */
  --pencil: #3a3632;
  --pencil-light: #ece5d6;
  --night: #1b1a18;
  --ok: #2f7a3e; --ok-soft: #dcefdf;
  --warn: #9a6a12; --warn-soft: #f6ead0;
  --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161514; --surface: #1f1d1b; --line: #34302b; --ink: #efe9dc; --muted: #a39b8d;
  --crimson: #e2393f; --crimson-soft: #3a1a1b; --teal: #4fb3ae; --gold: #d2a64a;
  --ok: #6cc07c; --ok-soft: #1d3322; --warn: #e0b04f; --warn-soft: #3a2f17; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161514; --surface: #1f1d1b; --line: #34302b; --ink: #efe9dc; --muted: #a39b8d;
  --crimson: #e2393f; --crimson-soft: #3a1a1b; --teal: #4fb3ae; --gold: #d2a64a;
  --ok: #6cc07c; --ok-soft: #1d3322; --warn: #e0b04f; --warn-soft: #3a2f17; color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
a { color: inherit }
button, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--crimson); outline-offset: 2px }

.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100% }
.side { border-right: 1px solid var(--line); background: var(--surface); position: sticky; top: env(safe-area-inset-top, 0px);
  height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto; padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 14px }
.brand { display: block; text-decoration: none; margin-bottom: 14px }
.brand b { font: 800 22px/1 var(--display); font-stretch: 75%; letter-spacing: .01em; text-transform: uppercase; display: block }
.brand span { font: 12px var(--mono); color: var(--muted) }
.group { margin-top: 16px }
.group h3 { margin: 0 0 4px; font: 700 12px/1.3 var(--display); font-stretch: 85%; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  display: flex; gap: 6px; align-items: baseline }
.group h3 .yrs { font: 11px var(--mono); letter-spacing: 0; text-transform: none }
.scene-link { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 8px; align-items: center; padding: 5px 8px; border-radius: 6px;
  text-decoration: none; font-size: 13.5px; line-height: 1.3 }
.scene-link:hover { background: var(--bg) }
.scene-link[aria-current="page"] { background: var(--crimson-soft) }
.scene-link .id { font: 11px var(--mono); color: var(--muted); display: block }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted) }
.dot.approved { background: var(--ok); border-color: var(--ok) }
.dot.drafted { background: var(--paper); border-color: var(--crimson) }
.dot.revise { background: var(--warn); border-color: var(--warn) }
.dot.waiting, .dot.not-started, .dot.partial { background: transparent; border-style: dashed }
.side .divider { margin: 22px 0 6px; font: 700 11px var(--display); font-stretch: 85%; letter-spacing: .12em; text-transform: uppercase; color: var(--crimson) }

main { min-width: 0; padding-block: 22px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 22px }
.picker { display: none }
.eyebrow { font: 12px var(--mono); color: var(--muted); letter-spacing: .02em }
h1 { margin: 2px 0 0; font: 800 clamp(28px, 4vw, 44px)/1.02 var(--display); font-stretch: 72%; text-transform: uppercase; text-wrap: balance; letter-spacing: .005em }
h2 { margin: 0; font: 800 22px/1.1 var(--display); font-stretch: 80%; text-transform: uppercase; letter-spacing: .01em }
.lede { color: var(--muted); max-width: 68ch; margin: 6px 0 0 }

.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--body); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap }
.chip.approved { background: var(--ok-soft); color: var(--ok); border-color: transparent }
.chip.drafted { background: var(--crimson-soft); color: var(--crimson); border-color: transparent }
.chip.revise { background: var(--warn-soft); color: var(--warn); border-color: transparent }
.chip.waiting, .chip.not-started, .chip.partial { color: var(--muted); border-style: dashed }
.chip.tag { font: 500 11px var(--mono); padding: 4px 8px; border-radius: 4px }
.chip.tag.gen { color: var(--crimson); border-color: var(--crimson) }
.chip.tag.real { color: var(--teal); border-color: var(--teal) }
.chip.tag.perm { color: var(--gold); border-color: var(--gold) }

/* overview */
.counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.count { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px 14px; display: grid; gap: 2px; text-align: left; cursor: pointer }
.count[aria-pressed="true"] { border-color: var(--crimson); box-shadow: inset 0 0 0 1px var(--crimson) }
.count b { font: 800 30px/1 var(--display); font-stretch: 80%; font-variant-numeric: tabular-nums }
.count span { font-size: 13px; color: var(--muted) }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface) }
table { border-collapse: collapse; width: 100%; min-width: 620px }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px }
th { font: 600 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; background: var(--bg) }
tr.grp td { background: var(--bg); font: 700 13px var(--display); font-stretch: 85%; text-transform: uppercase; letter-spacing: .05em }
td.mono { font: 12.5px var(--mono); white-space: nowrap }
td a { text-decoration: none } td a:hover { text-decoration: underline; text-decoration-color: var(--crimson) }

/* scene */
.scene-head { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between }
.review { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 14px; display: grid; gap: 10px }
.review-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 14px; cursor: pointer; font-weight: 600 }
.btn:hover { border-color: var(--ink) }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.btn:disabled { opacity: .5; cursor: not-allowed }
textarea { width: 100%; min-height: 64px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--bg); resize: vertical }
.note { font-size: 13px; color: var(--muted) }
.note.warn { color: var(--warn) }
.nav-row { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap }

.panel { border-top: 2px solid var(--ink); padding-top: 14px; display: grid; gap: 14px }
.panel-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline }
.panel-head .pid { font: 500 13px var(--mono); color: var(--crimson) }
.panel-head .ptype { font: 11px var(--mono); color: var(--muted) }
.panel-body { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 20px }
.variants { display: grid; gap: 14px }
.variant-tabs { display: flex; flex-wrap: wrap; gap: 6px }
.variant-tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer }
.variant-tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.frames { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start }
.frame { margin: 0; flex: 1 1 260px; min-width: 0; display: grid; gap: 4px }
.frame.tall { flex: 0 1 230px }
.frame figcaption { font: 11.5px var(--mono); color: var(--muted) }
.frame svg { width: 100%; height: auto; display: block; border: 1.5px solid var(--pencil); border-radius: 2px; background: var(--paper); box-shadow: 0 1px 0 var(--line) }
.spec { display: grid; gap: 10px; align-content: start; font-size: 14px }
.spec dl { margin: 0; display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 6px 10px }
.spec dt { font: 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding-top: 2px }
.spec dd { margin: 0 }
.copy { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none }
.copy li { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; font-size: 14px }
.copy .t { font: 11px/1.35 var(--mono); color: var(--muted); padding-top: 2px; overflow-wrap: anywhere }
.copy .x.edit { color: var(--warn) }
.edit-mark { background: var(--warn-soft); color: var(--warn); border-radius: 3px; padding: 0 3px }
.tags { display: flex; flex-wrap: wrap; gap: 6px }
.items { display: grid; gap: 18px; padding-left: 14px; border-left: 2px dashed var(--line) }
.items h4 { margin: 0; font: 800 15px var(--display); font-stretch: 85%; text-transform: uppercase }
.layer-tabs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.layer-tabs .lbl { font: 11px var(--mono); color: var(--muted); margin-right: 2px }
.layer-tabs button { border: 1px dashed var(--line); background: transparent; border-radius: 4px; padding: 3px 9px; font-size: 12px; cursor: pointer }
.layer-tabs button[aria-pressed="true"] { border-style: solid; border-color: var(--teal); color: var(--teal); font-weight: 600 }
.plate { font: 600 11px var(--mono); padding: 4px 8px; border-radius: 4px; border: 1px solid currentColor }
.plate.generate { color: var(--crimson) } .plate.code { color: var(--teal) } .plate.evidence { color: var(--gold) }
.refs { display: grid; gap: 8px }
.ref { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 12px 14px; display: grid; gap: 4px }
.ref .rid { font: 500 12px var(--mono); color: var(--crimson) }
.ref b { font: 700 15px var(--body) }
.ref .meta { font-size: 13px; color: var(--muted) }
.ref .scenes { font: 12px var(--mono) }
.ref .scenes a { text-decoration: none; margin-right: 6px }
.chip.needed { color: var(--crimson); border-color: var(--crimson) }
.chip.received { background: var(--ok-soft); color: var(--ok); border-color: transparent }
.ref-filter { display: flex; flex-wrap: wrap; gap: 6px }
.empty { border: 1.5px dashed var(--line); border-radius: 8px; padding: 18px; color: var(--muted); background: var(--surface) }

@media (max-width: 880px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .side { display: none }
  .picker { display: grid; gap: 4px }
  .picker select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface) }
  .panel-body { grid-template-columns: minmax(0, 1fr) }
}
@media (prefers-reduced-motion: no-preference) { .frame svg { transition: box-shadow .2s } .frame svg:hover { box-shadow: 0 6px 18px rgba(0,0,0,.12) } }
</style>

// Keep every caption, list and label inside the frame (runs once the SVG is laid out).
function fitFrame(svg) {
  const [, , W, H] = svg.getAttribute('viewBox').split(' ').map(Number);
  const pad = 10;
  for (const fo of svg.querySelectorAll('foreignObject')) {
    const box = fo.firstChild && fo.firstChild.firstChild;
    if (!box) continue;
    let w = box.offsetWidth, h = box.offsetHeight;
    let fs = parseFloat(getComputedStyle(box).fontSize) || 20, guard = 0;
    while (h > H - 2 * pad && fs > 11 && guard++ < 20) { fs -= 1; box.style.fontSize = fs + 'px'; h = box.offsetHeight; w = box.offsetWidth; }
    let x = +fo.getAttribute('x'), y = +fo.getAttribute('y');
    if (x + w > W - pad) x = Math.max(pad, W - pad - w);
    if (y + h > H - pad) y = Math.max(pad, H - pad - h);
    x = Math.max(pad, x); y = Math.max(pad, y);
    fo.setAttribute('x', x); fo.setAttribute('y', y); fo.setAttribute('height', h + 6);
    const tail = fo.dataset.tail;
    if (tail) {
      const [tx, ty] = tail.split(',').map(Number);
      const cx = Math.min(Math.max(tx, x + 24), x + w - 24);
      const below = ty > y + h, by = below ? y + h - 2 : y + 2;
      const p = el('path', { d: `M${cx - 14} ${by} L${tx} ${ty} L${cx + 14} ${by} Z`, fill: '#fff', stroke: '#1d1b19', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, null);
      fo.parentNode.insertBefore(p, fo);
    }
  }
  for (const t of svg.querySelectorAll('text')) {
    let bb; try { bb = t.getBBox(); } catch { continue; }
    if (bb.width > W - 2 * pad) {
      const fsz = parseFloat(t.getAttribute('font-size')) || 24;
      t.setAttribute('font-size', fsz * (W - 2 * pad) / bb.width);
      bb = t.getBBox();
    }
    let dx = 0, dy = 0;
    if (bb.x < pad) dx = pad - bb.x; else if (bb.x + bb.width > W - pad) dx = W - pad - bb.x - bb.width;
    if (bb.y < pad) dy = pad - bb.y; else if (bb.y + bb.height > H - pad) dy = H - pad - bb.y - bb.height;
    if (dx || dy) t.setAttribute('transform', `translate(${dx} ${dy})`);
  }
}

    }
  } else {
    const P = POSES[pose] || POSES.stand;
    const units = age === 'teen' ? 7.4 : 8;
    const u = h / units;
    const pt = ([px, py]) => [x + facing * px * u, y + py * u * (units / 8) * (age === 'old' ? .97 : 1)];
    const mass = red ? u * .9 : 0;  // red figures read as a solid silhouette
    const line = (a, b, w = 3) => roughLine(grp, ...pt(a), ...pt(b), { r, stroke: s, w: mass || w, passes: 1, jitter: .8 });
    const [hx, hy] = pt(P.head);
    const headR = u * (age === 'teen' ? .58 : .5);
    let neck = P.neck, hip = P.hip;
    if (age === 'old' && !P.seat) { neck = [neck[0] + .3, neck[1]]; }
    line(neck, hip, red ? u * 1.4 : 3);
    for (const [e, hnd] of P.arms) { line([neck[0], neck[1] + .35], e); line(e, hnd); }
    for (const [kn, ft] of P.legs) { line(hip, kn); line(kn, ft); }
    if (P.seat) roughLine(grp, ...pt([-.4, -3.2]), ...pt([1.8, -3.2]), { r, stroke: s, w: 1.4, passes: 1, dash: true });
    el('circle', { cx: hx, cy: hy, r: headR, fill: red ? C.red : P.hair ? s : (onDark ? '#2a2826' : '#f6f1e6'), 'fill-opacity': red || P.hair ? .85 : 1, stroke: s, 'stroke-width': 2.6 }, grp);
    if (!P.hair && !words.includes('f')) el('path', { d: `M${hx + facing * headR * .9} ${hy - 2} l${facing * 7} 6 l${-facing * 7} 2`, fill: 'none', stroke: s, 'stroke-width': 2 }, grp);
    if (age === 'old') roughLine(grp, ...pt([.9, -4]), ...pt([1.1, 0]), { r, stroke: s, w: 2, passes: 1 });
  }
  if (flags.has('detail')) drawDetail(grp, x, y, h, pose, facing);
  if (label) {
    const H = +g.ownerSVGElement?.getAttribute('viewBox')?.split(' ')[3] || 99999;
    const ly = y + 26 <= H - 8 ? y + 26 : y - h - 10;
    hand(g, x, ly, label, { fill: s, size: 23, anchor: 'middle' }).setAttribute('opacity', faint ? .7 : 1);
  }
}

// Rim-light detail lines over a red silhouette: collar, shoulder seams, folded forearms, jaw.
function drawDetail(g, x, y, h, pose, facing) {
  const c = '#f3c6c6', o = { fill: 'none', stroke: c, 'stroke-width': 2.4, 'stroke-linecap': 'round', opacity: .85 };
  if (pose === 'bust' || pose === 'silhouette') {
    el('path', { ...o, d: `M${x - h * .1} ${y - h * .5} L${x} ${y - h * .36} L${x + h * .1} ${y - h * .5}` }, g);
    el('path', { ...o, d: `M${x - h * .3} ${y - h * .38} Q${x - h * .36} ${y - h * .2} ${x - h * .34} ${y}` }, g);
    el('path', { ...o, d: `M${x + h * .3} ${y - h * .38} Q${x + h * .36} ${y - h * .2} ${x + h * .34} ${y}` }, g);
    el('path', { ...o, d: `M${x - h * .12} ${y - h * .6} Q${x} ${y - h * .5} ${x + h * .12} ${y - h * .6}` }, g);
  } else {
    const u = h / 8;
    el('path', { ...o, d: `M${x - u * .35} ${y - u * 6.85} L${x} ${y - u * 6.3} L${x + u * .35} ${y - u * 6.85}` }, g);
    el('path', { ...o, d: `M${x - u * .9} ${y - u * 5.3} Q${x} ${y - u * 5.0} ${x + u * .9} ${y - u * 5.6}` }, g);
    el('path', { ...o, d: `M${x - u * .9} ${y - u * 5.75} Q${x} ${y - u * 5.45} ${x + u * .9} ${y - u * 5.15}` }, g);
    el('path', { ...o, d: `M${x - u * .7} ${y - u * 4.1} L${x + u * .7} ${y - u * 4.1}` }, g);
    el('path', { ...o, d: `M${x - u * .3} ${y - u * 7.2} Q${x} ${y - u * 6.9} ${x + u * .3} ${y - u * 7.2}` }, g);
  }
}

function drawCaption(g, type, x, y, w, line, W, H, tail) {
  const fo = el('foreignObject', { x, y, width: w, height: H, 'data-fit': 'cap' }, g);
  if (tail && (type === 'DIA' || type === 'THO')) fo.dataset.tail = tail.join(',');
  const div = document.createElement('div');
  div.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
  const text = line ? line.x : `(no ${type} line in the script)`;
  const who = line && line.s ? `<b style="display:block;font:700 15px var(--display);font-stretch:80%;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px">${esc(line.s)}</b>` : '';
  const base = 'font:20px/1.32 "Hanken Grotesk",Arial,sans-serif;color:#1d1b19;padding:10px 14px;display:inline-block;max-width:100%;';
  const styles = {
    NAR: base + 'background:#fbf7ee;border:2px solid #1d1b19;border-left:7px solid #b3121f;',
    THO: base + 'background:#ffffffee;border:2px dashed #3a3632;border-radius:26px;font-style:italic;',
    DIA: base + 'background:#fff;border:2.5px solid #1d1b19;border-radius:18px 18px 18px 4px;',
    FAC: base + 'background:#1d1b19;color:#f6f1e6;font:16px/1.35 "IBM Plex Mono",monospace;',
    SUB: base + 'background:#fbf7ee;border:2px solid #1d1b19;',
    SKL: base + 'background:#f6f1e6;border:1.5px solid #1f7a78;color:#1f7a78;font:15px/1.3 "IBM Plex Mono",monospace;border-radius:999px;',
    PORTAL: base + 'background:#fff;border:2.5px solid #b3121f;color:#b3121f;font-weight:600;border-radius:4px;',
    SFX: 'font:900 54px/1 Archivo,Arial Narrow,sans-serif;font-stretch:70%;color:#b3121f;letter-spacing:.04em;transform:rotate(-6deg);display:inline-block;',
  };
  div.style.cssText = 'width:100%';
  const inner = type === 'PORTAL' ? `${markEdits(text)} &rarr;` : markEdits(text);
  div.innerHTML = `<div style='${styles[type] || base}'>${who}${inner}</div>`;
  fo.appendChild(div);
}

// ---- views --------------------------------------------------------------
const side = document.getElementById('side');
const view = document.getElementById('view');

function sideHTML() {
  let html = `<a class="brand" href="#"><b>Storyboard Room</b><span>Reginald Tan · Story mode</span></a><a class="scene-link" href="#references" data-id="references"><span class="dot drafted"></span><span>Reference images<span class="id">${REFS.filter((r) => r.status === 'needed').length} still needed</span></span></a>`;
  let arcsStarted = false;
  for (const g of DATA) {
    if (g.kind === 'arc' && !arcsStarted) { html += `<div class="divider">Side stories (arcs)</div>`; arcsStarted = true; }
    html += `<div class="group"><h3>${esc(g.kind === 'chapter' ? g.title : g.title || g.id)}${g.years && g.years !== 'none' ? `<span class="yrs">${esc(g.years)}</span>` : ''}</h3>`;
    for (const s of g.scenes) {
      const e = effective(s);
      html += `<a class="scene-link" href="#${s.id}" data-id="${s.id}"><span class="dot ${e.status}" title="${LABEL[e.status]}"></span><span>${esc(s.label)}<span class="id">${s.id}</span></span></a>`;
    }
    html += `</div>`;
  }
  return html;
}

function pickerHTML(current) {
  let html = `<label class="picker"><span class="eyebrow">Jump to a scene</span><select id="scene-picker"><option value="">Overview — all scenes</option><option value="references" ${current === 'references' ? 'selected' : ''}>Reference images</option>`;
  for (const g of DATA) {
    html += `<optgroup label="${esc((g.kind === 'arc' ? 'Arc · ' : '') + (g.title || g.id))}">`;
    for (const s of g.scenes) html += `<option value="${s.id}" ${s.id === current ? 'selected' : ''}>${s.id} · ${esc(s.label)} — ${LABEL[effective(s).status]}</option>`;
    html += `</optgroup>`;
  }
  return html + `</select></label>`;
}

let filter = null;
function overview() {
  const counts = {}; for (const s of scenes) { const st = effective(s).status; counts[st] = (counts[st] || 0) + 1; }
  let html = pickerHTML('');
  html += `<header><div class="eyebrow">docs/STORY-SCRIPT.md · ${scenes.length} scenes</div><h1>Storyboards</h1>
    <p class="lede">Every scene gets a rough storyboard before any image is generated. Pick a scene to see its sketches, the current script lines, camera and scroll notes. Approve it here, or add <code>storyboard: approved</code> to the scene in the script. Captions, titles, diagrams and screen contents are drawn in code over the art, so they can change without regenerating an image — use “Show” on any panel to see which parts need a generated plate. <a href="#references">Reference images to collect →</a></p></header>`;
  html += `<div class="counts" role="group" aria-label="Filter by status">${ORDER.filter((k) => counts[k]).map((k) =>
    `<button class="count" data-filter="${k}" aria-pressed="${filter === k}"><b>${counts[k]}</b><span>${LABEL[k]}</span></button>`).join('')}</div>`;
  html += dbNote();
  html += `<div class="table-wrap"><table><thead><tr><th>Scene</th><th>Title</th><th>Panels</th><th>Storyboard</th></tr></thead><tbody>`;
  for (const g of DATA) {
    const rows = g.scenes.filter((s) => !filter || effective(s).status === filter);
    if (!rows.length) continue;
    html += `<tr class="grp"><td colspan="4">${g.kind === 'arc' ? 'Arc · ' : ''}${esc(g.title || g.id)}${g.years && g.years !== 'none' ? ` · ${esc(g.years)}` : ''}</td></tr>`;
    for (const s of rows) {
      const e = effective(s);
      html += `<tr><td class="mono"><a href="#${s.id}">${s.id}</a></td><td><a href="#${s.id}">${esc(s.label)}</a></td><td class="mono">${s.panels.length}</td>
        <td><span class="chip ${e.status}">${LABEL[e.status]}</span>${e.source === 'viewer' ? ` <span class="note">saved here, not yet in the script</span>` : ''}</td></tr>`;
    }
  }
  html += `</tbody></table></div>`;
  view.innerHTML = html;
  view.querySelectorAll('[data-filter]').forEach((b) => b.addEventListener('click', () => { filter = filter === b.dataset.filter ? null : b.dataset.filter; overview(); }));
  wirePicker();
}

function dbNote() {
  if (dbState === 'ready') return '';
  if (dbState === 'loading') return `<p class="note">Loading saved reviews…</p>`;
  if (dbState === 'slow') return `<p class="note warn">Saved reviews can't be reached yet. Statuses shown come from the script.</p>`;
  return `<p class="note">Reviews can't be saved in this view. Statuses come from the script — add <code>storyboard: approved</code> or <code>storyboard: revise</code> to a scene's <code>story</code> block instead.</p>`;
}

const PLATE = { generate: 'Needs a generated plate', code: 'Built in code — nothing to generate', evidence: 'Real evidence + code — nothing to generate' };
function tagClass(t) { return t.startsWith('GENERATE') ? 'gen' : t.startsWith('REAL') ? 'real' : t.startsWith('NEEDS') ? 'perm' : ''; }

function panelHTML(p, sceneId, isItem) {
  const b = p.board;
  const head = `<div class="panel-head"><span class="pid">${p.id}</span>${isItem ? `<h4>${esc(p.title || p.label)}</h4>` : `<h2>${esc(p.label)}</h2>`}
    ${p.type ? `<span class="ptype">${p.type}</span>` : ''}${p.art ? `<span class="ptype">art: ${esc(p.art)}</span>` : ''}${p.plate ? `<span class="plate ${p.plate}">${PLATE[p.plate]}</span>` : ''}${p.status === 'hold' ? `<span class="chip">on hold</span>` : ''}</div>`;
  const copy = (p.copy || []).filter((l) => l.t !== 'VISUAL');
  const visual = (p.copy || []).filter((l) => l.t === 'VISUAL').map((l) => esc(l.x)).join(' ');
  const copyHTML = copy.length ? `<ul class="copy">${copy.map((l) => `<li><span class="t">${l.t}${l.s ? `·${esc(l.s)}` : ''}</span><span class="x ${l.st === 'edit' ? 'edit' : ''}">${markEdits(l.x)}${l.st !== 'draft' ? ` <span class="note">{${l.st}}</span>` : ''}</span></li>`).join('')}</ul>` : '';
  let sketch;
  if (b && b.variants && b.variants.length) {
    const tabs = b.variants.length > 1 ? `<div class="variant-tabs" role="tablist">${b.variants.map((v, i) => `<button role="tab" aria-selected="${i === 0}" data-v="${i}">${esc(v.label || 'Option ' + (i + 1))}</button>`).join('')}</div>` : '';
    const layers = `<div class="layer-tabs" role="group" aria-label="Layers"><span class="lbl">Show</span><button data-layer="all" aria-pressed="true">Composite</button><button data-layer="art" aria-pressed="false">Generated plate</button><button data-layer="overlay" aria-pressed="false">Code overlays + evidence</button></div>`;
    sketch = `<div class="variants" data-panel="${p.id}">${tabs}${layers}<div class="frames"></div></div>`;
  } else sketch = `<div class="empty">No storyboard yet for this ${isItem ? 'card' : 'panel'}.</div>`;
  const spec = b ? `<dl>${['shot', 'camera', 'scroll', 'transition', 'mobile', 'refs', 'note'].filter((k) => b[k]).map((k) => `<dt>${k}</dt><dd>${b[k].map(esc).join('<br>')}</dd>`).join('')}</dl>
    ${b.tags ? `<div class="tags">${b.tags.map((t) => `<span class="chip tag ${tagClass(t)}">${esc(t)}</span>`).join('')}</div>` : ''}` : '';
  const items = (p.items || []).length ? `<div class="items">${p.items.map((i) => panelHTML(i, sceneId, true)).join('')}</div>` : '';
  return `<section class="panel" id="p-${p.id}">${head}<div class="panel-body"><div>${sketch}</div><div class="spec">${spec}
    ${visual ? `<dl><dt>visual</dt><dd>${visual}</dd></dl>` : ''}${copyHTML ? `<div><div class="eyebrow">Script lines (live from the script)</div>${copyHTML}</div>` : ''}</div></div>${items}</section>`;
}

function refHTML(r) {
  return `<div class="ref"><span class="rid">${esc(r.id)}</span><b>${esc(r.name)}</b>
    <div class="meta">${esc(r.source || '')}</div>
    ${r.privacy ? `<div class="meta">Privacy: ${esc(r.privacy)}</div>` : ''}
    ${r.notes ? `<div class="meta">${esc(r.notes)}</div>` : ''}
    <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center"><span class="chip ${esc((r.status || '').split(' ')[0])}">${esc(r.status || '')}</span>${r.priority ? `<span class="chip tag">priority ${esc(r.priority)}</span>` : ''}<span class="scenes">${(r.scenes || []).map((x) => `<a href="#${x}">${x}</a>`).join('')}</span></div></div>`;
}

let refFilter = 'all';
function refsView() {
  let html = pickerHTML('');
  html += `<div class="nav-row"><a class="btn" href="#">← Overview</a></div>`;
  html += `<header><div class="eyebrow">docs/story/REFERENCES.md · ${REFS.length} references</div><h1>Reference images</h1>
    <p class="lede">What to collect before generating anything, built from the drafted storyboards. Photos of you and other people stay out of the public repo — keep them in a private folder named by reference ID. Arcs still waiting on script edits are listed under Pending.</p></header>`;
  const counts = { needed: 0, received: 0, 'not needed': 0 }; for (const r of REFS) counts[r.status] = (counts[r.status] || 0) + 1;
  html += `<div class="ref-filter" role="group" aria-label="Filter references">${['all', 'needed', 'received', 'not needed'].map((k) => `<button class="btn" data-rf="${k}" aria-pressed="${refFilter === k}" style="${refFilter === k ? 'border-color:var(--ink)' : ''}">${k === 'all' ? 'All' : k[0].toUpperCase() + k.slice(1)} (${k === 'all' ? REFS.length : counts[k] || 0})</button>`).join('')}</div>`;
  const sections = [...new Set(REFS.map((r) => r.section))];
  for (const sec of sections) {
    const rows = REFS.filter((r) => r.section === sec && (refFilter === 'all' || r.status === refFilter));
    if (!rows.length) continue;
    html += `<section class="panel"><div class="panel-head"><h2>${esc(sec)}</h2></div><div class="refs">${rows.map(refHTML).join('')}</div></section>`;
  }
  view.innerHTML = html;
  view.querySelectorAll('[data-rf]').forEach((b) => b.addEventListener('click', () => { refFilter = b.dataset.rf; refsView(); }));
  wirePicker();
}

function sceneView(id) {
  const s = byId[id];
  if (!s) { overview(); return; }
  const idx = scenes.indexOf(s), prev = scenes[idx - 1], next = scenes[idx + 1];
  const e = effective(s);
  const g = s.group;
  const review = reviews[s.id];
  let html = pickerHTML(id);
  html += `<div class="nav-row"><a class="btn" href="#">← Overview</a><span>${prev ? `<a class="btn" href="#${prev.id}">← ${prev.id}</a> ` : ''}${next ? `<a class="btn" href="#${next.id}">${next.id} →</a>` : ''}</span></div>`;
  html += `<header class="scene-head"><div><div class="eyebrow">${g.kind === 'arc' ? `Arc · ${esc(g.id)}${g.parent ? ` · returns to ${esc(g.parent)}` : ''}` : `Chapter ${esc(g.order)} · ${esc(g.title)}${g.years && g.years !== 'none' ? ' · ' + esc(g.years) : ''}`} · ${s.id}</div>
    <h1>${esc(s.label)}</h1></div><span class="chip ${e.status}">${LABEL[e.status]}</span></header>`;
  html += reviewHTML(s, e, review);
  if (!s.panels.some((p) => p.board)) html += `<div class="empty">${s.status === 'waiting' ? 'Waiting on script edits before this scene can be storyboarded. Fill the <b>[EDIT: …]</b> gaps below in docs/STORY-SCRIPT.md.' : 'Not storyboarded yet.'}</div>`;
  html += s.panels.map((p) => panelHTML(p, s.id, false)).join('');
  const sref = REFS.filter((r) => (r.scenes || []).includes(s.id));
  html += `<section class="panel"><div class="panel-head"><h2>Reference images for this scene</h2><a class="ptype" href="#references">all references →</a></div>${
    sref.length ? `<div class="refs">${sref.map(refHTML).join('')}</div>` : `<p class="note">${NOREF.has(s.id) ? 'None — this scene is built entirely in code.' : 'None listed yet.'}</p>`}</section>`;
  html += `<div class="nav-row"><a class="btn" href="#">← Overview</a><span>${next ? `<a class="btn" href="#${next.id}">Next: ${next.id} →</a>` : ''}</span></div>`;
  view.innerHTML = html;
  view.querySelectorAll('.variants').forEach((v) => {
    const p = findPanel(s, v.dataset.panel);
    let cur = 0, layer = 'all';
    const show = (i) => {
      cur = i;
      const box = v.querySelector('.frames'); box.innerHTML = '';
      for (const [fi, fr] of p.board.variants[i].frames.entries()) {
        const fig = document.createElement('figure');
        const [aw, ah] = fr.aspect.split(':').map(Number);
        fig.className = 'frame' + (ah > aw ? ' tall' : '');
        const svg = renderFrame(fr, p, `${p.id}-${i}-${fi}`, layer);
        fig.appendChild(svg);
        const cap = document.createElement('figcaption'); cap.textContent = `${fr.aspect}${fr.label ? ' · ' + fr.label : ''}`; fig.appendChild(cap);
        box.appendChild(fig);
        fitFrame(svg);
      }
      v.querySelectorAll('[role=tab]').forEach((t) => t.setAttribute('aria-selected', String(Number(t.dataset.v) === i)));
    };
    v.querySelectorAll('[role=tab]').forEach((t) => t.addEventListener('click', () => show(Number(t.dataset.v))));
    v.querySelectorAll('[data-layer]').forEach((b) => b.addEventListener('click', () => {
      layer = b.dataset.layer;
      v.querySelectorAll('[data-layer]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      show(cur);
    }));
    show(0);
  });
  wireReview(s);
  wirePicker();
}

function findPanel(s, pid) { for (const p of s.panels) { if (p.id === pid) return p; for (const i of p.items || []) if (i.id === pid) return i; } }

function reviewHTML(s, e, review) {
  review = review || null;
  const drafted = s.panels.some((p) => p.board);
  let state = '';
  if (e.source === 'script' && (e.status === 'approved' || e.status === 'revise')) state = `<p class="note">Set in the script (<code>storyboard: ${e.status}</code>).</p>`;
  else if (review && review.status === 'addressed') { state = `<p class="note">Your change request from ${esc(new Date(review.at).toLocaleDateString())} was applied${review.addressedAt ? ' on ' + esc(new Date(review.addressedAt).toLocaleDateString()) : ''}. Review the new version below.</p>${review.note ? `<p class="note">You asked: “${esc(review.note)}”</p>` : ''}${review.reply ? `<p>What changed: ${esc(review.reply)}</p>` : ''}`; review = null; }
  else if (review) state = `<p class="note ${review.hash !== s.hash ? 'warn' : ''}">${review.status === 'approved' ? 'Approved' : 'Changes requested'} here${review.at ? ' on ' + esc(new Date(review.at).toLocaleDateString()) : ''}${review.hash !== s.hash ? ' — the storyboard or script changed since then, so check it again' : ''}. Ask Claude to “sync storyboard reviews” to write this into the script.</p>${review.note ? `<p>“${esc(review.note)}”</p>` : ''}`;
  if (!drafted) return `<div class="review"><strong>Review</strong>${state || '<p class="note">Nothing to review yet.</p>'}</div>`;
  const disabled = dbState !== 'ready' || canWrite === false ? 'disabled' : '';
  const why = dbState === 'ready' && canWrite === false ? `<p class="note">Only the artifact's owner and editors can save reviews.</p>` : dbNote();
  return `<div class="review"><strong>Review this storyboard</strong>${state}
    <label for="review-note" class="note">Notes for Claude (optional — what to change)</label>
    <textarea id="review-note" placeholder="e.g. Move the narration to the bottom; make Reginald smaller in frame 2">${esc(review?.note || '')}</textarea>
    <div class="review-row"><button class="btn primary" id="approve" ${disabled}>Approve storyboard</button><button class="btn" id="revise" ${disabled}>Request changes</button>${review ? `<button class="btn" id="clear" ${disabled}>Clear my review</button>` : ''}<span class="note" id="review-msg" role="status"></span></div>${why}</div>`;
}

let db = null;
function wireReview(s) {
  const msg = document.getElementById('review-msg');
  const save = async (status) => {
    if (!db) return;
    const note = document.getElementById('review-note').value.trim();
    msg.textContent = 'Saving…';
    try {
      await db.collection('reviews').doc(s.id).set({ status, note, hash: s.hash, at: new Date().toISOString() });
      msg.textContent = status === 'approved' ? 'Approved.' : 'Change request saved.';
    } catch (err) { msg.textContent = err && err.code === 'permission_denied' ? 'Only the owner and editors can save reviews.' : 'Couldn’t save. Try again in a moment.'; }
  };
  document.getElementById('approve')?.addEventListener('click', () => save('approved'));
  document.getElementById('revise')?.addEventListener('click', () => save('revise'));
  document.getElementById('clear')?.addEventListener('click', async () => {
    try { await db.collection('reviews').doc(s.id).delete(); msg.textContent = 'Cleared.'; } catch { msg.textContent = 'Couldn’t clear it.'; }
  });
}

function wirePicker() {
  const sel = document.getElementById('scene-picker');
  sel?.addEventListener('change', () => { location.hash = sel.value ? sel.value : ''; if (!sel.value) route(); });
}

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  side.innerHTML = sideHTML();
  side.querySelectorAll('.scene-link').forEach((a) => { if (a.dataset.id === id) { a.setAttribute('aria-current', 'page'); } });
  if (id === 'references') refsView(); else if (id && byId[id]) sceneView(id); else overview();
}
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
route();
const cur = side.querySelector('[aria-current="page"]'); if (cur) cur.scrollIntoView({ block: 'center' });

// ---- saved reviews (artifact db) ----------------------------------------
(async () => {
  const timer = setTimeout(() => { if (dbState === 'loading') { dbState = 'slow'; rerender(); } }, 10000);
  try {
    if (!window.claude || !window.claude.use) throw new Error('no viewer');
    db = await window.claude.use('db');
    if (!db) throw new Error('no db');
    const user = await window.claude.use('user');
    canWrite = user ? await user.can('data.write').then((v) => v !== false).catch(() => null) : null;
    if (user) { try { canWrite = (await user.canEdit()) || (await user.isOwner()); } catch { /* keep */ } }
    db.collection('reviews').onSnapshot((snap) => {
      reviews = {}; for (const d of snap.docs) if (d.exists) reviews[d.id] = d.data();
      if (!snap.metadata.fromCache) { clearTimeout(timer); dbState = 'ready'; } else if (dbState === 'loading') dbState = 'ready';
      rerender();
    }, () => { clearTimeout(timer); dbState = 'unavailable'; rerender(); });
  } catch { clearTimeout(timer); dbState = 'unavailable'; rerender(); }
})();

function rerender() {
  const note = document.getElementById('review-note');
  const draft = note ? note.value : null, focused = document.activeElement === note;
  const y = window.scrollY;
  route();
  const n2 = document.getElementById('review-note');
  if (n2 && draft !== null) { n2.value = draft; if (focused) n2.focus(); }
  window.scrollTo(0, y);
}
</script>
