<style>
/* Layout: a storyboard room — scene index on the left wall, the board for one scene on the table.
   Chrome is graphite/ivory like the Story itself; sketches are always on drawing paper. */
:root {
  --bg: #f1ede4;          /* room, light */
  --surface: #fbf9f4;
  --line: #d8d1c3;
  --ink: #1d1b19;
  --muted: #6b645a;
  --crimson: #b3121f;
  --crimson-soft: #f4dcdc;
  --teal: #1f7a78;
  --gold: #9a7420;
  --paper: #f6f1e6;       /* sketch paper — same in both themes */
  --pencil: #3a3632;
  --pencil-light: #ece5d6;
  --night: #1b1a18;
  --ok: #2f7a3e; --ok-soft: #dcefdf;
  --warn: #9a6a12; --warn-soft: #f6ead0;
  --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161514; --surface: #1f1d1b; --line: #34302b; --ink: #efe9dc; --muted: #a39b8d;
  --crimson: #e2393f; --crimson-soft: #3a1a1b; --teal: #4fb3ae; --gold: #d2a64a;
  --ok: #6cc07c; --ok-soft: #1d3322; --warn: #e0b04f; --warn-soft: #3a2f17; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161514; --surface: #1f1d1b; --line: #34302b; --ink: #efe9dc; --muted: #a39b8d;
  --crimson: #e2393f; --crimson-soft: #3a1a1b; --teal: #4fb3ae; --gold: #d2a64a;
  --ok: #6cc07c; --ok-soft: #1d3322; --warn: #e0b04f; --warn-soft: #3a2f17; color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
a { color: inherit }
button, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--crimson); outline-offset: 2px }

.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100% }
.side { border-right: 1px solid var(--line); background: var(--surface); position: sticky; top: env(safe-area-inset-top, 0px);
  height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto; padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 14px }
.brand { display: block; text-decoration: none; margin-bottom: 14px }
.brand b { font: 800 22px/1 var(--display); font-stretch: 75%; letter-spacing: .01em; text-transform: uppercase; display: block }
.brand span { font: 12px var(--mono); color: var(--muted) }
.group { margin-top: 16px }
.group h3 { margin: 0 0 4px; font: 700 12px/1.3 var(--display); font-stretch: 85%; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  display: flex; gap: 6px; align-items: baseline }
.group h3 .yrs { font: 11px var(--mono); letter-spacing: 0; text-transform: none }
.scene-link { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 8px; align-items: center; padding: 5px 8px; border-radius: 6px;
  text-decoration: none; font-size: 13.5px; line-height: 1.3 }
.scene-link:hover { background: var(--bg) }
.scene-link[aria-current="page"] { background: var(--crimson-soft) }
.scene-link .id { font: 11px var(--mono); color: var(--muted); display: block }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted) }
.dot.approved { background: var(--ok); border-color: var(--ok) }
.dot.drafted { background: var(--paper); border-color: var(--crimson) }
.dot.revise { background: var(--warn); border-color: var(--warn) }
.dot.waiting, .dot.not-started, .dot.partial { background: transparent; border-style: dashed }
.side .divider { margin: 22px 0 6px; font: 700 11px var(--display); font-stretch: 85%; letter-spacing: .12em; text-transform: uppercase; color: var(--crimson) }

main { min-width: 0; padding-block: 22px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 22px }
.picker { display: none }
.eyebrow { font: 12px var(--mono); color: var(--muted); letter-spacing: .02em }
h1 { margin: 2px 0 0; font: 800 clamp(28px, 4vw, 44px)/1.02 var(--display); font-stretch: 72%; text-transform: uppercase; text-wrap: balance; letter-spacing: .005em }
h2 { margin: 0; font: 800 22px/1.1 var(--display); font-stretch: 80%; text-transform: uppercase; letter-spacing: .01em }
.lede { color: var(--muted); max-width: 68ch; margin: 6px 0 0 }

.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--body); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap }
.chip.approved { background: var(--ok-soft); color: var(--ok); border-color: transparent }
.chip.drafted { background: var(--crimson-soft); color: var(--crimson); border-color: transparent }
.chip.revise { background: var(--warn-soft); color: var(--warn); border-color: transparent }
.chip.waiting, .chip.not-started, .chip.partial { color: var(--muted); border-style: dashed }
.chip.tag { font: 500 11px var(--mono); padding: 4px 8px; border-radius: 4px }
.chip.tag.gen { color: var(--crimson); border-color: var(--crimson) }
.chip.tag.real { color: var(--teal); border-color: var(--teal) }
.chip.tag.perm { color: var(--gold); border-color: var(--gold) }

/* overview */
.counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.count { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px 14px; display: grid; gap: 2px; text-align: left; cursor: pointer }
.count[aria-pressed="true"] { border-color: var(--crimson); box-shadow: inset 0 0 0 1px var(--crimson) }
.count b { font: 800 30px/1 var(--display); font-stretch: 80%; font-variant-numeric: tabular-nums }
.count span { font-size: 13px; color: var(--muted) }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface) }
table { border-collapse: collapse; width: 100%; min-width: 620px }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px }
th { font: 600 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; background: var(--bg) }
tr.grp td { background: var(--bg); font: 700 13px var(--display); font-stretch: 85%; text-transform: uppercase; letter-spacing: .05em }
td.mono { font: 12.5px var(--mono); white-space: nowrap }
td a { text-decoration: none } td a:hover { text-decoration: underline; text-decoration-color: var(--crimson) }

/* scene */
.scene-head { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between }
.review { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 14px; display: grid; gap: 10px }
.review-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 14px; cursor: pointer; font-weight: 600 }
.btn:hover { border-color: var(--ink) }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.btn:disabled { opacity: .5; cursor: not-allowed }
textarea { width: 100%; min-height: 64px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--bg); resize: vertical }
.note { font-size: 13px; color: var(--muted) }
.note.warn { color: var(--warn) }
.nav-row { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap }

.panel { border-top: 2px solid var(--ink); padding-top: 14px; display: grid; gap: 14px }
.panel-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline }
.panel-head .pid { font: 500 13px var(--mono); color: var(--crimson) }
.panel-head .ptype { font: 11px var(--mono); color: var(--muted) }
.panel-body { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 20px }
.variants { display: grid; gap: 14px }
.variant-tabs { display: flex; flex-wrap: wrap; gap: 6px }
.variant-tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer }
.variant-tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.frames { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start }
.frame { margin: 0; flex: 1 1 260px; min-width: 0; display: grid; gap: 4px }
.frame.tall { flex: 0 1 230px }
.frame figcaption { font: 11.5px var(--mono); color: var(--muted) }
.frame svg { width: 100%; height: auto; display: block; border: 1.5px solid var(--pencil); border-radius: 2px; background: var(--paper); box-shadow: 0 1px 0 var(--line) }
.spec { display: grid; gap: 10px; align-content: start; font-size: 14px }
.spec dl { margin: 0; display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 6px 10px }
.spec dt { font: 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding-top: 2px }
.spec dd { margin: 0 }
.copy { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none }
.copy li { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; font-size: 14px }
.copy .t { font: 11px/1.35 var(--mono); color: var(--muted); padding-top: 2px; overflow-wrap: anywhere }
.copy .x.edit { color: var(--warn) }
.edit-mark { background: var(--warn-soft); color: var(--warn); border-radius: 3px; padding: 0 3px }
.tags { display: flex; flex-wrap: wrap; gap: 6px }
.items { display: grid; gap: 18px; padding-left: 14px; border-left: 2px dashed var(--line) }
.items h4 { margin: 0; font: 800 15px var(--display); font-stretch: 85%; text-transform: uppercase }
.layer-tabs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.layer-tabs .lbl { font: 11px var(--mono); color: var(--muted); margin-right: 2px }
.layer-tabs button { border: 1px dashed var(--line); background: transparent; border-radius: 4px; padding: 3px 9px; font-size: 12px; cursor: pointer }
.layer-tabs button[aria-pressed="true"] { border-style: solid; border-color: var(--teal); color: var(--teal); font-weight: 600 }
.phone { width: min(320px, 100%); border: 2px solid var(--ink); border-radius: 22px; padding: 14px 10px 18px; background: var(--night); display: grid; gap: 10px }
.phone > svg { width: 100%; height: auto; display: block; background: var(--paper); border: 2px solid #050505 }
.pedge { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; position: relative; z-index: 2; padding: 0 8px }
.pedge.top { margin-bottom: -16px } .pedge.bottom { margin-top: -16px }
.pcaps, .gutter { display: flex; flex-direction: column; gap: 6px; align-items: flex-start }
.gutter { flex: 1 1 100%; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 6px }
.gutter .lbl { font: 11px var(--mono); color: var(--muted); margin-right: 4px }
.phone .capwrap > div, .gutter .capwrap > div { font-size: 13px !important }
.phone .capwrap > div[data-cap="SFX"] { font-size: 30px !important }
.pcard { background: var(--paper); color: #1d1b19; border: 2px solid #050505; padding: 8px 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
.pcard b { font: 800 14px var(--display); font-stretch: 78% } .pcard span { font: 10px var(--mono); color: #6b645a }
.pcard.on { border-color: var(--crimson) }
.studio-tabs { display: flex; flex-wrap: wrap; gap: 6px } .studio-tabs .btn.on { border-color: var(--ink); background: var(--ink); color: var(--bg) }
.btn.small { padding: 5px 10px; font-size: 12.5px }
.dz { border: 2px dashed var(--line); border-radius: 8px; padding: 12px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; cursor: pointer; background: var(--surface) }
.dz b { font-size: 14px } .dz > span:first-of-type { font-size: 12.5px; color: var(--muted) }
.dz.on { border-color: var(--crimson); border-style: solid; box-shadow: inset 0 0 0 1px var(--crimson) }
.dz.over { background: var(--crimson-soft) }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: 12px; margin-top: 10px }
.tiles.wide { grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)) }
.tile { margin: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; display: grid }
.tileimgs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); background: var(--night) }
.tileimgs img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: var(--night) }
.tile figcaption { display: grid; gap: 6px; padding: 10px; font-size: 13px }
.tile label { display: grid; gap: 3px; font-size: 12px; color: var(--muted) }
.tile input, .tile textarea, .tile select, .charform input, .charform textarea, .eras input, #newchar { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; min-width: 0 }
.tile .meta { font: 11px var(--mono); color: var(--muted); overflow-wrap: anywhere }
.tilebtns { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.ripplebox { position: relative; cursor: pointer; overflow: hidden }
.ripplebox img { position: absolute; inset: 0; height: 100%; object-fit: cover } .ripplebox img.base { position: static }
.ripplebox .standin { filter: grayscale(1) contrast(1.7) brightness(1.06) }
.ripplebox .rip { clip-path: circle(0 at var(--rx) var(--ry)); animation: rip .8s cubic-bezier(.4, 0, .2, 1) forwards }
@keyframes rip { to { clip-path: circle(150% at var(--rx) var(--ry)) } }
.ripplebox .rtag { position: absolute; left: 6px; bottom: 6px; font: 10.5px var(--mono); background: rgba(0, 0, 0, .7); color: #fff; padding: 2px 6px }
.years { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 14px }
.yearcol h3 { margin: 0 0 6px; font: 800 20px var(--display); font-stretch: 80% }
.refwrap { display: grid; gap: 8px; padding-bottom: 14px; border-bottom: 1px dashed var(--line) }
.charform { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 10px }
.charform label { display: grid; gap: 3px; font-size: 12px; color: var(--muted) }
.eras input { width: 100%; min-width: 110px }
.charphotos { display: flex; flex-wrap: wrap; gap: 6px } .charphotos img { width: 76px; height: 76px; object-fit: cover; border-radius: 4px; display: block }
@media (prefers-reduced-motion: reduce) { .ripplebox .rip { animation-duration: .01s } }
.plate { font: 600 11px var(--mono); padding: 4px 8px; border-radius: 4px; border: 1px solid currentColor }
.plate.generate { color: var(--crimson) } .plate.code { color: var(--teal) } .plate.evidence { color: var(--gold) }
.refs { display: grid; gap: 8px }
.ref { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 12px 14px; display: grid; gap: 4px }
.ref .rid { font: 500 12px var(--mono); color: var(--crimson) }
.ref b { font: 700 15px var(--body) }
.ref .meta { font-size: 13px; color: var(--muted) }
.ref .scenes { font: 12px var(--mono) }
.ref .scenes a { text-decoration: none; margin-right: 6px }
.chip.needed { color: var(--crimson); border-color: var(--crimson) }
.chip.received { background: var(--ok-soft); color: var(--ok); border-color: transparent }
.ref-filter { display: flex; flex-wrap: wrap; gap: 6px }
.empty { border: 1.5px dashed var(--line); border-radius: 8px; padding: 18px; color: var(--muted); background: var(--surface) }

@media (max-width: 880px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .side { display: none }
  .picker { display: grid; gap: 4px }
  .picker select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface) }
  .panel-body { grid-template-columns: minmax(0, 1fr) }
}
@media (prefers-reduced-motion: no-preference) { .frame svg { transition: box-shadow .2s } .frame svg:hover { box-shadow: 0 6px 18px rgba(0,0,0,.12) } }
</style>

    const base = { r, w: flags.has('faint') ? 1.4 : 2.2, dash: flags.has('dash') };
    switch (k) {
      case 'dark': darks.push([a, b, c, d]); el('rect', { x: X(a), y: Y(b), width: X(c), height: Y(d), fill: C.night, opacity: show && layer === 'overlay' && lay !== 'overlay' ? .18 : 1 }, g); break;
      case 'wash': el('rect', { x: X(a), y: Y(b), width: X(c), height: Y(d), fill: C.red, opacity: .55 }, g); break;
      case 'floor': roughLine(g, 0, Y(a), W, Y(a), { ...base, stroke: dark(50, a) ? C.light : C.pencil, w: 1.6 }); break;
      case 'vp': for (const [tx, ty] of [[0, 0], [100, 0], [0, 100], [100, 100], [0, 50], [100, 50], [25, 100], [75, 100]])
          el('line', { x1: X(a), y1: Y(b), x2: X(tx), y2: Y(ty), stroke: dark(a, b) ? C.light : C.pencil, 'stroke-width': 1, opacity: .22, 'stroke-dasharray': '4 6' }, g);
        break;
      case 'line': roughLine(g, X(a), Y(b), X(c), Y(d), { ...base, stroke: ink((a + c) / 2, (b + d) / 2), w: flags.has('red') ? 3.2 : base.w, passes: flags.has('faint') ? 1 : 2 }); break;
      case 'arrow': {
        const s = ink((a + c) / 2, (b + d) / 2);
        roughLine(g, X(a), Y(b), X(c), Y(d), { ...base, stroke: s, w: 2.4 });
        const ang = Math.atan2(Y(d) - Y(b), X(c) - X(a)), L = 18;
        el('path', { d: `M${X(c)} ${Y(d)} L${X(c) - L * Math.cos(ang - .45)} ${Y(d) - L * Math.sin(ang - .45)} M${X(c)} ${Y(d)} L${X(c) - L * Math.cos(ang + .45)} ${Y(d) - L * Math.sin(ang + .45)}`, stroke: s, 'stroke-width': 2.4, fill: 'none', 'stroke-linecap': 'round' }, g);
        if (label) hand(g, X((a + c) / 2) + 6, Y((b + d) / 2) - 10, label, { fill: s, size: 24 });
        break;
      }
      case 'box': case 'paper': case 'building': case 'screen': case 'card': {
        const s = ink(a + c / 2, b + d / 2);
        const fill = flags.has('fill') ? (dark(a, b) ? '#2a2826' : '#e3dccd') : k === 'paper' ? '#fffdf8' : k === 'card' ? (dark(a, b) ? '#232120' : '#efe8da') : null;
        roughRect(g, X(a), Y(b), X(c), Y(d), { ...base, stroke: s, fill, w: k === 'card' ? 3.4 : base.w });
        if (k === 'screen') {
          roughRect(g, X(a) + 8, Y(b) + 8, X(c) - 16, Y(d) - 16, { r, stroke: s, w: 1.2, passes: 1 });
          for (let i = 0; i < 3; i++) el('line', { x1: X(a) + 18, y1: Y(b) + 24 + i * 12, x2: X(a) + 18 + (X(c) - 40) * (.4 + r() * .4), y2: Y(b) + 24 + i * 12, stroke: s, 'stroke-width': 2, opacity: .45 }, g);
        }
        if (k === 'building') for (let yy = b + 6; yy < b + d - 2; yy += 6) el('line', { x1: X(a) + 4, y1: Y(yy), x2: X(a + c) - 4, y2: Y(yy), stroke: s, 'stroke-width': 1, opacity: .4 }, g);
        if (k === 'paper') {
          for (let i = 1; i < 6 && b + i * d / 7 < b + d; i++) el('line', { x1: X(a) + 10, y1: Y(b + i * d / 7) + 12, x2: X(a + c) - 10 - r() * 20, y2: Y(b + i * d / 7) + 12, stroke: s, 'stroke-width': 1.4, opacity: .35 }, g);
        }
        if (label) {
          if (k === 'card') {
            const t = el('text', { x: X(a) + 14, y: Y(b + d) - 16, fill: s, 'font-family': 'Archivo, Arial Narrow, sans-serif', 'font-weight': 800, 'font-size': Math.min(34, X(c) / 9), 'font-stretch': '75%' }, g);
            t.textContent = clean(label);
          } else hand(g, X(a + c / 2), k === 'screen' ? Y(b) - 8 : Y(b + d / 2), label, { fill: s, size: 25, anchor: 'middle', base: k === 'screen' ? 'auto' : 'middle' });
        }
        break;
      }
      case 'chart': {
        const s = flags.has('red') ? C.red : ink(a, b); let pts = [], n = 12;
        for (let i = 0; i <= n; i++) pts.push(`${X(a + c * i / n)},${Y(b + d - d * (i / n) * .8 - (r() * d * .25))}`);
        el('polyline', { points: pts.join(' '), fill: 'none', stroke: s, 'stroke-width': 3, 'stroke-linejoin': 'round' }, g);
        break;
      }
      case 'tree': {
        const s = ink(a, b);
        roughLine(g, X(a), Y(b), X(a), Y(b - c * .45), { r, stroke: s, w: 2.4 });
        for (let i = 0; i < 4; i++) el('circle', { cx: X(a) + (r() - .5) * X(c) * .5, cy: Y(b - c * .7) + (r() - .5) * Y(c) * .3, r: Y(c) * .22, fill: 'none', stroke: s, 'stroke-width': 1.6, opacity: .7 }, g);
        break;
      }
      case 'disc': {
        const red = flags.has('red');
        el('circle', { cx: X(a), cy: Y(b), r: X(c), fill: red ? C.red : 'none', opacity: red ? .9 : 1, stroke: red ? C.red : ink(a, b), 'stroke-width': 2.2 }, g);
        break;
      }
      case 'phone': {
        const red = flags.has('red');
        if (red) el('circle', { cx: X(a) + 13, cy: Y(b) + 24, r: 44, fill: C.red, opacity: .22 }, g);
        roughRect(g, X(a), Y(b), 26, 48, { r, stroke: red ? C.red : ink(a, b), w: 2.4, fill: red ? C.red : null, fillOpacity: .85 });
        break;
      }
      case 'fig': drawFigure(g, X(a), Y(b), Y(c), words, flags, ink(a, b - c / 2), C, r, label, dark(a, b - c / 2)); break;
      case 'text': {
        const color = flags.has('red') ? C.red : flags.has('ivory') ? '#efe9dc' : C.pencil;
        const t = el('text', { x: X(a), y: Y(b), fill: color, 'font-family': /[㐀-鿿]/.test(label || '') ? '"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif' : 'Archivo, Arial Narrow, sans-serif',
          'font-weight': 900, 'font-size': Y(c), 'font-stretch': '68%', 'text-anchor': flags.has('center') ? 'middle' : 'start', 'dominant-baseline': 'middle', 'letter-spacing': flags.has('wide') ? Y(c) * 1.15 : c < 4 ? 6 : 0 }, g);
        t.textContent = clean(label);
        break;
      }
      case 'crop': {
        const [x0, y0, w0, h0] = nums;
        el('rect', { x: X(x0), y: Y(y0), width: X(w0), height: Y(h0), fill: 'none', stroke: C.teal, 'stroke-width': 3, 'stroke-dasharray': '14 9' }, g);
        const tag = el('g', {}, g);
        el('rect', { x: X(x0), y: Y(y0), width: 16 + (tok[1].length + 5) * 11, height: 28, fill: C.teal }, tag);
        const t = el('text', { x: X(x0) + 8, y: Y(y0) + 20, fill: '#fff', 'font-family': 'IBM Plex Mono, monospace', 'font-size': 17 }, tag);
        t.textContent = tok[1] + ' crop';
        break;
      }
      case 'label': hand(g, X(a), Y(b), label || '', { fill: dark(a, b) ? C.light : C.pencil, size: 25 }); break;
      case 'cap': {
        const tail = words.find((w) => w.startsWith('tail='));
        const tp = tail ? tail.slice(5).split(',').map(Number) : null;
        const mob = layer === 'mobile';
        const cw = mob ? Math.max(nums[2], 62) : nums[2], cx = mob ? Math.min(nums[0], 98 - cw) : nums[0];
        drawCaption(g, tok[1], X(Math.max(cx, 2)), Y(nums[1]), X(cw), lineFor(panel, tok[1], nums[3]), W, H, tp ? [X(tp[0]), Y(tp[1])] : null, mob ? 2.3 : 1);
        break;
      }
      case 'nav': {
        const tabs = (label || 'CV|Tech|Finance|Life').split('|');
        const x0 = X(a), y0 = Y(b), w = X(c), h = Y(d), slant = Math.tan(17 * Math.PI / 180) * h;
        el('rect', { x: x0 + 5, y: y0 + 5, width: w, height: h, fill: '#050505' }, g);
        el('rect', { x: x0, y: y0, width: w, height: h, fill: '#efe9dc', stroke: '#050505', 'stroke-width': 4 }, g);
        tabs.forEach((t, i) => {
          const tx = x0 + (w * i) / tabs.length, tw = w / tabs.length;
          if (i === 1) el('polygon', { points: `${tx + slant / 2},${y0} ${tx + tw + slant / 2},${y0} ${tx + tw - slant / 2},${y0 + h} ${tx - slant / 2},${y0 + h}`, fill: '#b3121f' }, g);
          if (i) el('line', { x1: tx + slant / 2, y1: y0, x2: tx - slant / 2, y2: y0 + h, stroke: '#050505', 'stroke-width': 3.5 }, g);
          const tt = el('text', { x: tx + tw / 2, y: y0 + h / 2, fill: i === 1 ? '#fff' : '#050505', 'font-family': 'Archivo, Arial Narrow, sans-serif', 'font-weight': 800, 'font-stretch': '80%',
            'font-size': Math.min(h * .5, tw / 5.2), 'text-anchor': 'middle', 'dominant-baseline': 'central', 'letter-spacing': 1.5 }, g);
          tt.textContent = t.toUpperCase();
        });
        break;
      }
      case 'board': {
        // Genuine content on a screen, slide or whiteboard: title + lines, fitted inside the box.
        const strs = words.filter((w) => !['red', 'code', 'faint', 'light', 'mono'].includes(w));
        const lines = (strs[strs.length - 1] || '').split('|');
        const title = strs.length > 1 ? strs[0] : '';
        const light = words.includes('light'), mono = words.includes('mono');
        el('rect', { x: X(a), y: Y(b), width: X(c), height: Y(d), fill: light ? '#f7f4ec' : '#101418', stroke: light ? '#8d877b' : '#2b3138', 'stroke-width': 3 }, g);
        const fo = el('foreignObject', { x: X(a) + 6, y: Y(b) + 6, width: X(c) - 12, height: Y(d) - 12, 'data-fit': 'board' }, g);
        const div = document.createElement('div');
        div.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
        const col = light ? '#1d1b19' : '#e6efe9', acc = light ? '#b3121f' : '#ff6b6b';
        const face = mono ? "'IBM Plex Mono',ui-monospace,monospace" : "'Hanken Grotesk',Arial,sans-serif";
        div.innerHTML = `<div style="font:500 22px/1.32 ${face};color:${col};display:grid;gap:4px;white-space:pre-wrap">${title ? `<b style="font-family:Archivo,Arial Narrow,sans-serif;font-weight:800;font-stretch:80%;letter-spacing:.04em;color:${acc}">${esc(title)}</b>` : ''}${lines.map((l) => `<span>${esc(l)}</span>`).join('')}</div>`;
        fo.appendChild(div);
        break;
      }
      case 'list': {
        const strs = words.filter((w) => !['red', 'code', 'faint'].includes(w));
        const items = (strs[strs.length - 1] || '').split('|').filter(Boolean);
        const title = strs.length > 1 ? strs[0] : '';
        const onDark = dark(a, b);
        const fo = el('foreignObject', { x: X(a), y: Y(b), width: X(c), height: H, 'data-fit': 'list' }, g);
        const div = document.createElement('div');
        div.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
        const col = onDark ? '#ece5d6' : '#1d1b19';
        div.innerHTML = `<div style="font:500 19px/1.35 'Hanken Grotesk',Arial,sans-serif;color:${col};display:grid;gap:6px">${title ? `<b style="font:800 18px Archivo,Arial Narrow,sans-serif;font-stretch:78%;letter-spacing:.06em;text-transform:uppercase">${esc(title)}</b>` : ''}${items.map((t, i) => `<span style="display:flex;gap:8px;align-items:center"><span style="width:15px;height:15px;border:2px solid ${i === 0 ? '#b3121f' : col};flex:none;${i === 0 ? 'background:#b3121f' : ''}"></span>${esc(t)}</span>`).join('')}</div>`;
        fo.appendChild(div);
        break;
      }
    }
    if (lay === 'evidence' && ['box', 'screen', 'paper'].includes(k)) {
      const tg = el('g', {}, g);
      el('rect', { x: X(a) + 4, y: Y(b) + 4, width: 62, height: 22, fill: C.teal }, tg);
      const t = el('text', { x: X(a) + 10, y: Y(b) + 20, fill: '#fff', 'font-family': 'IBM Plex Mono, monospace', 'font-size': 14 }, tg); t.textContent = 'REAL';
    }
  }
  return svg;
}

// Keep every caption, list and label inside the frame (runs once the SVG is laid out).
function fitFrame(svg) {
  const [, , W, H] = svg.getAttribute('viewBox').split(' ').map(Number);
  const pad = 10;
  for (const fo of svg.querySelectorAll('foreignObject')) {
    const box = fo.firstChild && fo.firstChild.firstChild;
    if (!box) continue;
    if (fo.dataset.fit === 'board') {  // fixed box: shrink the text until it fits
      const bw = +fo.getAttribute('width'), bh = +fo.getAttribute('height');
      let f = parseFloat(getComputedStyle(box).fontSize) || 22, n = 0;
      while ((box.scrollHeight > bh || box.scrollWidth > bw) && f > 6 && n++ < 40) { f -= 1; box.style.fontSize = f + 'px'; }
      continue;
    }
    let w = box.offsetWidth, h = box.offsetHeight;
    let fs = parseFloat(getComputedStyle(box).fontSize) || 20, guard = 0;
    while (h > H - 2 * pad && fs > 11 && guard++ < 20) { fs -= 1; box.style.fontSize = fs + 'px'; h = box.offsetHeight; w = box.offsetWidth; }
    let x = +fo.getAttribute('x'), y = +fo.getAttribute('y');
    if (x + w > W - pad) x = Math.max(pad, W - pad - w);
    if (y + h > H - pad) y = Math.max(pad, H - pad - h);
    x = Math.max(pad, x); y = Math.max(pad, y);
    fo.setAttribute('x', x); fo.setAttribute('y', y); fo.setAttribute('height', h + 6);
    const tail = fo.dataset.tail;
    if (tail) {
      const [tx, ty] = tail.split(',').map(Number);
      const cx = Math.min(Math.max(tx, x + 24), x + w - 24);
      const below = ty > y + h, by = below ? y + h - 2 : y + 2;
      const p = el('path', { d: `M${cx - 14} ${by} L${tx} ${ty} L${cx + 14} ${by} Z`, fill: '#fff', stroke: '#1d1b19', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, null);
      fo.parentNode.insertBefore(p, fo);
    }
  }
  for (const t of svg.querySelectorAll('text')) {
    let bb; try { bb = t.getBBox(); } catch { continue; }
    if (bb.width > W - 2 * pad) {
      const fsz = parseFloat(t.getAttribute('font-size')) || 24;
      t.setAttribute('font-size', fsz * (W - 2 * pad) / bb.width);
      bb = t.getBBox();
    }
    let dx = 0, dy = 0;
    if (bb.x < pad) dx = pad - bb.x; else if (bb.x + bb.width > W - pad) dx = W - pad - bb.x - bb.width;
    if (bb.y < pad) dy = pad - bb.y; else if (bb.y + bb.height > H - pad) dy = H - pad - bb.y - bb.height;
    if (dx || dy) t.setAttribute('transform', `translate(${dx} ${dy})`);
  }
}

function drawFigure(g, x, y, h, words, flags, stroke, C, r, label, onDark) {
  const facing = words.includes('l') ? -1 : 1;
  const age = words.find((w) => ['teen', 'young', 'adult', 'old'].includes(w)) || 'adult';
  const pose = words.find((w) => POSES[w] || w === 'bust' || w === 'silhouette') || 'stand';
  const red = flags.has('red'), faint = flags.has('faint');
  const s = red ? C.red : stroke;
  const op = faint ? .5 : 1;
  const grp = el('g', { opacity: op }, g);
  if (pose === 'bust' || pose === 'silhouette') {
    const front = words.includes('f');  // facing the camera: head centred and level, no profile nose
    const headR = h * .17, hx = x + (pose === 'bust' && !front ? facing * h * .04 : 0), hy = y - h * .66;
    const fill = pose === 'silhouette' || red ? (red ? C.red : s) : 'none';
    const d = `M${x - h * .5} ${y} C${x - h * .48} ${y - h * .3} ${x - h * .3} ${y - h * .38} ${x - h * .12} ${y - h * .44} L${x - h * .08} ${y - h * .52} L${x + h * .08} ${y - h * .52} L${x + h * .12} ${y - h * .44} C${x + h * .3} ${y - h * .38} ${x + h * .48} ${y - h * .3} ${x + h * .5} ${y} Z`;
    el('path', { d, fill, 'fill-opacity': fill === 'none' ? 0 : .92, stroke: s, 'stroke-width': 2.6 }, grp);
    el('ellipse', { cx: hx, cy: hy, rx: headR * .86, ry: headR, fill, 'fill-opacity': fill === 'none' ? 0 : .92, stroke: s, 'stroke-width': 2.6 }, grp);
    if (pose === 'bust' && !front) el('path', { d: `M${hx + facing * headR * .8} ${hy - 2} l${facing * 8} 10 l${-facing * 8} 3`, fill: 'none', stroke: s, 'stroke-width': 2 }, grp);
    if (words.includes('fold')) {  // arms folded across the chest
      el('path', { d: `M${x - h * .44} ${y - h * .2} Q${x} ${y - h * .3} ${x + h * .44} ${y - h * .2} L${x + h * .4} ${y - h * .08} Q${x} ${y - h * .16} ${x - h * .4} ${y - h * .08} Z`,
        fill: red ? '#8f0d18' : 'none', stroke: s, 'stroke-width': 2.4 }, grp);
      if (flags.has('detail')) el('path', { d: `M${x - h * .36} ${y - h * .2} Q${x} ${y - h * .27} ${x + h * .36} ${y - h * .17}`, fill: 'none', stroke: '#f3c6c6', 'stroke-width': 2.2, opacity: .85 }, grp);
    }
  } else {
    const P = POSES[pose] || POSES.stand;
    const units = age === 'teen' ? 7.4 : 8;
    const u = h / units;
    const pt = ([px, py]) => [x + facing * px * u, y + py * u * (units / 8) * (age === 'old' ? .97 : 1)];
    const mass = red ? u * .9 : 0;  // red figures read as a solid silhouette
    const line = (a, b, w = 3) => roughLine(grp, ...pt(a), ...pt(b), { r, stroke: s, w: mass || w, passes: 1, jitter: .8 });
    const [hx, hy] = pt(P.head);
    const headR = u * (age === 'teen' ? .58 : .5);
    let neck = P.neck, hip = P.hip;
    if (age === 'old' && !P.seat) { neck = [neck[0] + .3, neck[1]]; }
    line(neck, hip, red ? u * 1.4 : 3);
    for (const [e, hnd] of P.arms) { line([neck[0], neck[1] + .35], e); line(e, hnd); }
    for (const [kn, ft] of P.legs) { line(hip, kn); line(kn, ft); }
    if (P.seat) roughLine(grp, ...pt([-.4, -3.2]), ...pt([1.8, -3.2]), { r, stroke: s, w: 1.4, passes: 1, dash: true });
    el('circle', { cx: hx, cy: hy, r: headR, fill: red ? C.red : P.hair ? s : (onDark ? '#2a2826' : '#f6f1e6'), 'fill-opacity': red || P.hair ? .85 : 1, stroke: s, 'stroke-width': 2.6 }, grp);
    if (!P.hair && !words.includes('f')) el('path', { d: `M${hx + facing * headR * .9} ${hy - 2} l${facing * 7} 6 l${-facing * 7} 2`, fill: 'none', stroke: s, 'stroke-width': 2 }, grp);
    if (age === 'old') roughLine(grp, ...pt([.9, -4]), ...pt([1.1, 0]), { r, stroke: s, w: 2, passes: 1 });
  }
  if (flags.has('detail')) drawDetail(grp, x, y, h, pose, facing);
  if (label) {
    const H = +g.ownerSVGElement?.getAttribute('viewBox')?.split(' ')[3] || 99999;
    const ly = y + 26 <= H - 8 ? y + 26 : y - h - 10;
    hand(g, x, ly, label, { fill: s, size: 23, anchor: 'middle' }).setAttribute('opacity', faint ? .7 : 1);
  }
}

// Rim-light detail lines over a red silhouette: collar, shoulder seams, folded forearms, jaw.
function drawDetail(g, x, y, h, pose, facing) {
  const c = '#f3c6c6', o = { fill: 'none', stroke: c, 'stroke-width': 2.4, 'stroke-linecap': 'round', opacity: .85 };
  if (pose === 'bust' || pose === 'silhouette') {
    el('path', { ...o, d: `M${x - h * .1} ${y - h * .5} L${x} ${y - h * .36} L${x + h * .1} ${y - h * .5}` }, g);
    el('path', { ...o, d: `M${x - h * .3} ${y - h * .38} Q${x - h * .36} ${y - h * .2} ${x - h * .34} ${y}` }, g);
    el('path', { ...o, d: `M${x + h * .3} ${y - h * .38} Q${x + h * .36} ${y - h * .2} ${x + h * .34} ${y}` }, g);
  } else {
    const u = h / 8;
    el('path', { ...o, d: `M${x - u * .35} ${y - u * 6.85} L${x} ${y - u * 6.3} L${x + u * .35} ${y - u * 6.85}` }, g);
    el('path', { ...o, d: `M${x - u * .9} ${y - u * 5.3} Q${x} ${y - u * 5.0} ${x + u * .9} ${y - u * 5.6}` }, g);
    el('path', { ...o, d: `M${x - u * .9} ${y - u * 5.75} Q${x} ${y - u * 5.45} ${x + u * .9} ${y - u * 5.15}` }, g);
    el('path', { ...o, d: `M${x - u * .7} ${y - u * 4.1} L${x + u * .7} ${y - u * 4.1}` }, g);
    el('path', { ...o, d: `M${x - u * .3} ${y - u * 7.2} Q${x} ${y - u * 6.9} ${x + u * .3} ${y - u * 7.2}` }, g);
  }
}

function drawCaption(g, type, x, y, w, line, W, H, tail, scale = 1) {
  const fo = el('foreignObject', { x, y, width: w, height: H, 'data-fit': 'cap' }, g);
  if (tail && (type === 'DIA' || type === 'THO')) fo.dataset.tail = tail.join(',');
  const div = document.createElement('div');
  div.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
  div.style.cssText = 'width:100%';
  let html = capMarkup(type, line);
  if (scale !== 1) html = html.replace(/(\d+(?:\.\d+)?)px/g, (m, n) => `${(Number(n) * scale).toFixed(1)}px`);
  div.innerHTML = html;
  fo.appendChild(div);
}

function capMarkup(type, line) {
  const text = line ? (type === 'MODAL' ? `${line.s || 'Open list'} ▸` : line.x) : `(no ${type} line in the script)`;
  const who = line && line.s && type !== 'PORTAL' && type !== 'MODAL' ? `<b style="display:block;font:700 15px var(--display);font-stretch:80%;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px">${esc(line.s)}</b>` : '';
  const base = 'font:20px/1.32 "Hanken Grotesk",Arial,sans-serif;color:#1d1b19;padding:10px 14px;display:inline-block;max-width:100%;';
  const styles = {
    NAR: base + 'background:#fbf7ee;border:2px solid #1d1b19;border-left:7px solid #b3121f;',
    THO: base + 'background:#ffffffee;border:2px dashed #3a3632;border-radius:26px;font-style:italic;',
    DIA: base + 'background:#fff;border:2.5px solid #1d1b19;border-radius:18px 18px 18px 4px;',
    FAC: base + 'background:#1d1b19;color:#f6f1e6;font:16px/1.35 "IBM Plex Mono",monospace;',
    SUB: base + 'background:#fbf7ee;border:2px solid #1d1b19;',
    SKL: base + 'background:#f6f1e6;border:1.5px solid #1f7a78;color:#1f7a78;font:15px/1.3 "IBM Plex Mono",monospace;border-radius:999px;',
    PORTAL: base + 'background:#fff;border:2.5px solid #b3121f;color:#b3121f;font-weight:600;border-radius:4px;',
    MODAL: base + 'background:#1d1b19;color:#f6f1e6;border:2.5px solid #1d1b19;font-weight:600;border-radius:999px;',
    SFX: 'font:900 54px/1 Archivo,Arial Narrow,sans-serif;font-stretch:70%;color:#b3121f;letter-spacing:.04em;transform:rotate(-6deg);display:inline-block;',
  };
  const inner = type === 'PORTAL' ? `${markEdits(text)} &rarr;` : markEdits(text);
  const hint = type === 'PORTAL' && line && line.s ? `<small style="display:block;font:11px 'IBM Plex Mono',monospace;color:#6b645a;font-weight:400">button → arc: ${esc(line.s)}</small>`
    : type === 'MODAL' && line ? `<small style="display:block;font:11px 'IBM Plex Mono',monospace;color:#cfc8ba;font-weight:400">button → pop-up list (${line.x.split(' · ').length} items)</small>` : '';
  return `<div data-cap="${type}" style='${styles[type] || base}'>${who}${inner}${hint}</div>`;
}

// Lines the storyboard hasn't placed on a frame: they sit in the gutter under the panel.
function leftovers(p, variant) {
  const used = new Set();
  for (const fr of variant.frames) for (const t of fr.els) if (t[0] === 'cap') { const n = t.slice(2).filter((v) => /^-?\d+(\.\d+)?$/.test(v)); used.add(`${t[1]}-${n[3] ? Number(n[3]) : 1}`); }
  const count = {}, out = [];
  for (const l of p.copy || []) {
    if (['VISUAL', 'ALT'].includes(l.t)) continue;
    count[l.t] = (count[l.t] || 0) + 1;
    if (!used.has(`${l.t}-${count[l.t]}`)) out.push([l.t, l]);
  }
  return out;
}
function capList(pairs, cls) {
  const d = document.createElement('div'); d.className = cls;
  d.innerHTML = pairs.map(([t, l]) => `<div class="capwrap">${capMarkup(t, l)}</div>`).join('');
  return d;
}
function capsOf(p, fr) {
  return fr.els.filter((t) => t[0] === 'cap').map((t) => { const n = t.slice(2).filter((v) => /^-?\d+(\.\d+)?$/.test(v)).map(Number); return [t[1], lineFor(p, t[1], n[3])]; }).filter(([, l]) => l);
}
// What a phone shows: every frame whole (scaled, never cropped), captions stacked under it.
function phoneMock(p, variant) {
  const ph = document.createElement('div'); ph.className = 'phone'; const svgs = [];
  const add = (fr, owner, key) => { const s = renderFrame(fr, owner, key, 'story'); ph.appendChild(s); svgs.push(s); };
  if (p.type === 'PANEL_SELECTION' && (p.items || []).length) {
    p.items.forEach((it, i) => {
      const c = document.createElement('div'); c.className = 'pcard' + (i === 0 ? ' on' : '');
      c.innerHTML = `<b>${esc(it.title || it.id)}</b><span>${i === 0 ? 'tapped open' : 'tap to open'}</span>`;
      ph.appendChild(c);
      if (i === 0 && it.board) { const frs = it.board.variants[0].frames; add(frs[frs.length - 1], it, it.id + '-m'); ph.appendChild(capList((it.copy || []).filter((l) => ['SUB', 'NAR', 'PORTAL'].includes(l.t)).map((l) => [l.t, l]), 'pcaps')); }
    });
  } else {
    variant.frames.forEach((fr, i) => {
      const cs = capsOf(p, fr);
      const edge = cs.filter(([t]) => zoneOf(t) === 'edge'), out = cs.filter(([t]) => zoneOf(t) === 'out');
      const capY = (t) => { const tok = fr.els.find((e) => e[0] === 'cap' && e[1] === t); return tok ? Number(tok.slice(2).filter((v) => /^-?\d/.test(v))[1]) : 0; };
      const top = edge.filter(([t]) => capY(t) < 50), bottom = edge.filter(([t]) => capY(t) >= 50);
      if (top.length) ph.appendChild(capList(top, 'pedge top'));
      const s = renderFrame(fr, p, `${p.id}-m-${i}`, 'mobile'); ph.appendChild(s); svgs.push(s);
      if (bottom.length) ph.appendChild(capList(bottom, 'pedge bottom'));
      if (out.length) ph.appendChild(capList(out, 'pcaps'));
    });
  }
  const rest = leftovers(p, variant); if (rest.length) ph.appendChild(capList(rest, 'pcaps'));
  return { el: ph, svgs };
}

function dbNote() {
  if (dbState === 'ready') return '';
  if (dbState === 'loading') return `<p class="note">Loading saved reviews…</p>`;
  if (dbState === 'slow') return `<p class="note warn">Saved reviews can't be reached yet. Statuses shown come from the script.</p>`;
  return `<p class="note">Reviews can't be saved in this view. Statuses come from the script — add <code>storyboard: approved</code> or <code>storyboard: revise</code> to a scene's <code>story</code> block instead.</p>`;
}

let assetsApi = null;
let images = {};          // id -> doc
let characters = {};      // id -> doc
let activeTarget = null;  // where a paste goes: { meta, key, label }
let dirty = false;        // a form has unsaved typing — hold re-renders
let pendingRender = false;
const YEARS = [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026];
const MAX_BYTES = 20 * 1024 * 1024;
const blobUrl = (id) => '/_blob/' + id;
const STUDIO = { references: 'Reference library', characters: 'Characters', 'photo-scenes': 'Photo scenes', 'army-photos': 'Army photos' };

function studioNav(cur) {

    `<a class="btn ${k === cur ? 'on' : ''}" href="#${k}">${v}</a>`).join(' ')}</span></div>`;

function storeNote() {
  if (!db) return `<p class="note warn">Saving isn't available in this view (open the artifact on claude.ai while signed in).</p>`;
  if (!assetsApi) return `<p class="note warn">Only the artifact's owner and editors can upload. You can still read everything here.</p>`;
  return '';
}
function targetKey(meta) { return [meta.purpose, meta.ref || '', meta.year || '', meta.scene || '', meta.gallery || ''].join('|'); }
function imagesFor(meta) {
  return Object.entries(images).filter(([, d]) => d.purpose === meta.purpose && (meta.ref ? d.ref === meta.ref : true)
    && (meta.scene ? d.scene === meta.scene : true) && (meta.gallery ? d.gallery === meta.gallery : true))
    .sort((a, b) => (a[1].order ?? 0) - (b[1].order ?? 0) || String(a[1].at).localeCompare(String(b[1].at)));
}

async function imageSize(file) {
  try { const bmp = await createImageBitmap(file); const s = { w: bmp.width, h: bmp.height }; bmp.close?.(); return s; } catch { return { w: null, h: null }; }
}
async function uploadFiles(files, meta, msgEl) {
  if (!assetsApi || !db) { if (msgEl) msgEl.textContent = 'Uploading needs the owner or an editor, signed in on claude.ai.'; return; }
  const list = [...files].filter((f) => f && /^image\//.test(f.type));
  if (!list.length) { if (msgEl) msgEl.textContent = 'That wasn’t an image. Paste, drop or choose JPEG or PNG photos.'; return; }
  let done = 0;
  for (const f of list) {
    if (f.size > MAX_BYTES) { if (msgEl) msgEl.textContent = `${f.name} is over 20 MB — export a smaller JPEG and try again.`; continue; }
    if (msgEl) msgEl.textContent = `Uploading ${done + 1} of ${list.length}…`;
    try {
      const r = await assetsApi.upload(f);
      const size = await imageSize(f);
      const order = imagesFor(meta).length + done;
      await db.collection('images').doc(r.id).set({ ...meta, asset: r.id, name: f.name || 'pasted image', type: f.type, size: f.size, ...size,
        label: meta.defaultLabel || '', note: '', order, at: new Date().toISOString() });
      done += 1;
    } catch (err) {
      if (msgEl) msgEl.textContent = err && err.code === 'not_granted' ? 'Only the owner and editors can upload.' : err && err.code === 'unsupported_type' ? `${f.name}: that file type isn't accepted — use JPEG or PNG.` : 'Upload failed. Try again in a moment.';
    }
  }
  if (msgEl && done) msgEl.textContent = `Saved ${done} photo${done > 1 ? 's' : ''} (original files, untouched).`;
}

function dropZone(meta, title, hint) {

}

function wireStudio(root) {
  root.querySelectorAll('.dz').forEach((z) => {
    const meta = JSON.parse(z.dataset.meta);
    const activate = () => { activeTarget = { meta, key: z.dataset.key }; root.querySelectorAll('.dz').forEach((x) => { x.classList.toggle('on', x === z); x.setAttribute('aria-pressed', String(x === z)); x.querySelector('span').textContent = x === z ? 'Ready — press Ctrl/Cmd + V to paste here, or drop files' : 'Click, then paste (Ctrl/Cmd + V) · or drop photos · or'; }); };
    z.addEventListener('click', (e) => { if (!e.target.closest('label')) activate(); });
    z.addEventListener('focus', activate);
    z.addEventListener('dragover', (e) => { e.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', () => z.classList.remove('over'));
    z.addEventListener('drop', (e) => { e.preventDefault(); z.classList.remove('over'); activate(); uploadFiles(e.dataTransfer.files, meta, z.querySelector('.dzmsg')); });
    z.querySelector('input[type=file]').addEventListener('change', (e) => { activate(); uploadFiles(e.target.files, meta, z.querySelector('.dzmsg')); e.target.value = ''; });
  });
  root.querySelectorAll('.tile').forEach((t) => {
    const id = t.dataset.id;
    const msg = t.querySelector('.t-msg');
    t.querySelectorAll('input:not([type=file]),textarea,select').forEach((f) => f.addEventListener('input', () => { dirty = true; msg.textContent = 'Unsaved'; }));
    t.querySelector('.t-save')?.addEventListener('click', async () => {
      const patch = { label: t.querySelector('.f-label')?.value.trim() ?? '', updated: new Date().toISOString() };
      const n = t.querySelector('.f-note'); if (n) patch.note = n.value.trim();
      const r = t.querySelector('.f-ref'); if (r) patch.ref = r.value;
      const y = t.querySelector('.f-year'); if (y) patch.year = y.value ? Number(y.value) : null;
      const o = t.querySelector('.f-order'); if (o) patch.order = Number(o.value) || 0;
      try { await db.collection('images').doc(id).update(patch); dirty = false; msg.textContent = 'Saved'; } catch { msg.textContent = 'Couldn’t save — try again.'; }
    });
    t.querySelector('.t-del')?.addEventListener('click', async () => {
      if (t.dataset.confirm !== '1') { t.dataset.confirm = '1'; msg.textContent = 'Click Delete again to remove this photo for good.'; return; }
      const d = images[id];
      try { await db.collection('images').doc(id).delete(); if (d?.asset) await assetsApi.delete(d.asset).catch(() => {}); if (d?.comic) await assetsApi.delete(d.comic).catch(() => {}); } catch { msg.textContent = 'Couldn’t delete.'; }
    });
    t.querySelector('.f-comic')?.addEventListener('change', async (e) => {
      const f = e.target.files[0]; if (!f) return;
      msg.textContent = 'Uploading comic version…';
      try { const r = await assetsApi.upload(f); await db.collection('images').doc(id).update({ comic: r.id, comicName: f.name }); msg.textContent = 'Comic version saved'; }
      catch { msg.textContent = 'Upload failed.'; }
    });
    const rb = t.querySelector('.ripplebox');
    if (rb) {
      let showingOrig = false;
      const flip = (e) => {
        const r = rb.getBoundingClientRect();
        const x = e && e.clientX ? e.clientX - r.left : r.width / 2, y = e && e.clientY ? e.clientY - r.top : r.height / 2;
        const next = !showingOrig;
        const img = document.createElement('img');
        img.className = 'rip' + (!next && !rb.dataset.comic ? ' standin' : '');
        img.src = next ? rb.dataset.orig : (rb.dataset.comic || rb.dataset.orig);
        img.style.setProperty('--rx', x + 'px'); img.style.setProperty('--ry', y + 'px');
        rb.appendChild(img);
        img.addEventListener('animationend', () => { const base = rb.querySelector('.base'); base.src = img.src; base.classList.toggle('standin', img.classList.contains('standin')); img.remove(); showingOrig = next; rb.querySelector('.rtag').textContent = next ? 'Original photo · click for comic' : (rb.dataset.comic ? 'Comic version · click for original' : 'Stand-in comic look · click to ripple'); });
      };
      rb.addEventListener('click', flip); rb.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
    }
  });
}

document.addEventListener('paste', (e) => {
  if (!activeTarget) return;
  if (/INPUT|TEXTAREA/.test(document.activeElement?.tagName || '') && !(e.clipboardData?.files || []).length) return;
  const files = [...(e.clipboardData?.files || [])];
  if (!files.length) return;
  e.preventDefault();
  const z = view.querySelector(`.dz[data-key="${CSS.escape(activeTarget.key)}"]`);
  uploadFiles(files, activeTarget.meta, z?.querySelector('.dzmsg'));
});

function libraryView() {

    <p class="note">Tip: dropping or choosing files keeps the original file byte-for-byte. Pasting from some apps sends a re-encoded copy, so drop or choose originals where quality matters.</p></header>`;

const CHAR_FIELDS = [['role', 'Role in the story'], ['height', 'Height'], ['build', 'Build'], ['skin', 'Skin tone'], ['face', 'Face shape / features'],
  ['hair_colour', 'Hair colour'], ['hair_style', 'Hair style'], ['eyes', 'Eye colour'], ['glasses', 'Glasses'], ['facial_hair', 'Facial hair'],
  ['wardrobe', 'Usual clothes'], ['accessories', 'Accessories (watch, phone, camera…)'], ['likeness', 'Likeness permission'], ['notes', 'Notes / instructions for the artist']];
const ERA_FIELDS = [['hair', 'Hair'], ['glasses', 'Glasses'], ['wardrobe', 'Clothes'], ['watch', 'Watch'], ['phone', 'Phone'], ['other', 'Other']];

function charCard(id, c) {
  const eras = c.eras || [];
  const linked = Object.entries(images).filter(([, d]) => d.purpose === 'reference' && (c.refs || []).some((r) => d.ref === r || (r === 'REF-YOU' && String(d.ref || '').startsWith('REF-YOU'))));
  return `<section class="panel charcard" data-id="${esc(id)}">
    <div class="panel-head"><h2>${esc(c.name || id)}</h2>${c.refs?.length ? `<span class="ptype">${esc(c.refs.join(' · '))}</span>` : ''}</div>
    <div class="charform">${[['name', 'Name'], ...CHAR_FIELDS].map(([k, t]) => `<label>${t}${k === 'notes' ? `<textarea data-f="${k}" rows="3">${esc(c[k] || '')}</textarea>` : `<input data-f="${k}" value="${esc(c[k] || '')}">`}</label>`).join('')}</div>
    ${eras.length ? `<div class="table-wrap"><table class="eras"><thead><tr><th>Era</th>${ERA_FIELDS.map(([, t]) => `<th>${t}</th>`).join('')}</tr></thead><tbody>${eras.map((e, i) => `<tr data-i="${i}"><td><b>${esc(e.era)}</b>${e.when ? `<br><span class="note">${esc(e.when)}</span>` : ''}</td>${ERA_FIELDS.map(([k]) => `<td><input data-e="${k}" value="${esc(e[k] || '')}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>` : ''}
    ${linked.length ? `<div class="charphotos">${linked.slice(0, 18).map(([, d]) => `<a href="${blobUrl(d.asset)}" target="_blank" rel="noopener" title="${esc(d.label || d.ref)}"><img src="${blobUrl(d.asset)}" alt="${esc(d.label || 'reference')}" loading="lazy"></a>`).join('')}</div>` : `<p class="note">No photos linked yet — add them in the Reference library (${esc((c.refs || []).join(', ') || 'no reference IDs')}).</p>`}
    <div class="review-row"><button class="btn primary c-save" ${db && canWrite !== false ? '' : 'disabled'}>Save ${esc(c.name || id)}</button><span class="note c-msg" role="status"></span></div>
  </section>`;
}
function charactersView() {
  let html = pickerHTML('characters') + studioNav('characters');
  html += `<header><div class="eyebrow">${Object.keys(characters).length} characters</div><h1>Characters</h1>
    <p class="lede">Each character's look, for the character bible and every generation prompt. Edit any field and press Save. Your own entry has a row per era for hair, glasses, clothes, watch and phone.</p></header>`;
  html += db ? '' : storeNote();
  const order = ['reginald', 'ducky'];
  const ids = Object.keys(characters).sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99) || a.localeCompare(b));
  html += ids.length ? ids.map((id) => charCard(id, characters[id])).join('') : `<div class="empty">No characters yet — Claude adds the starting set.</div>`;
  html += `<section class="panel"><div class="panel-head"><h2>Add a character</h2></div><div class="review-row"><input id="newchar" placeholder="Name"><button class="btn" id="addchar" ${db ? '' : 'disabled'}>Add</button><span class="note" id="addmsg"></span></div></section>`;
  view.innerHTML = html;
  view.querySelectorAll('.charcard').forEach((card) => {
    const id = card.dataset.id, msg = card.querySelector('.c-msg');
    card.querySelectorAll('input,textarea').forEach((f) => f.addEventListener('input', () => { dirty = true; msg.textContent = 'Unsaved'; }));
    card.querySelector('.c-save').addEventListener('click', async () => {
      const c = JSON.parse(JSON.stringify(characters[id] || {}));
      card.querySelectorAll('[data-f]').forEach((f) => { c[f.dataset.f] = f.value.trim(); });
      card.querySelectorAll('tr[data-i]').forEach((tr) => { const e = c.eras[Number(tr.dataset.i)]; tr.querySelectorAll('[data-e]').forEach((f) => { e[f.dataset.e] = f.value.trim(); }); });
      c.updated = new Date().toISOString();
      try { await db.collection('characters').doc(id).set(c); dirty = false; msg.textContent = 'Saved'; } catch { msg.textContent = 'Couldn’t save — only the owner and editors can.'; }
    });
  });
  view.querySelector('#addchar')?.addEventListener('click', async () => {
    const name = view.querySelector('#newchar').value.trim(); if (!name) return;
    const id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'character';
    try { await db.collection('characters').doc(id).set({ name, refs: [], updated: new Date().toISOString() }); } catch { view.querySelector('#addmsg').textContent = 'Couldn’t add.'; }
  });
  wirePicker();
}

let photoScene = '';
function photoScenesView() {
  let html = pickerHTML('photo-scenes') + studioNav('photo-scenes');
  html += `<header><div class="eyebrow">Panel type PANEL_PHOTO</div><h1>Photo scenes</h1>
    <p class="lede">A photo scene is a panel made from one of your photos, redrawn in the comic style — people included. On the site, clicking it ripples between the comic version and your original. Pick the scene, add the photo, and describe what it should show. The original is kept untouched here; when you ask Claude to sync, it goes into the repo at full quality (location data removed), and the comic version is generated only after you approve that batch. You can also add a comic version yourself.</p></header>`;
  html += storeNote();
  html += `<label class="picker" style="display:grid"><span class="eyebrow">Scene this photo belongs to</span><select id="ps-scene"><option value="">Choose a scene…</option>${scenes.map((s) => `<option value="${s.id}" ${s.id === photoScene ? 'selected' : ''}>${s.id} · ${esc(s.label)}</option>`).join('')}</select></label>`;

    : `<div class="empty">No photo scenes yet.</div>`;

function sceneView(id) {
  const s = byId[id];
  if (!s) { overview(); return; }
  const idx = scenes.indexOf(s), prev = scenes[idx - 1], next = scenes[idx + 1];
  const e = effective(s);
  const g = s.group;
  const review = reviews[s.id];
  let html = pickerHTML(id);
  html += `<div class="nav-row"><a class="btn" href="#">← Overview</a><span>${prev ? `<a class="btn" href="#${prev.id}">← ${prev.id}</a> ` : ''}${next ? `<a class="btn" href="#${next.id}">${next.id} →</a>` : ''}</span></div>`;
  html += `<header class="scene-head"><div><div class="eyebrow">${g.kind === 'arc' ? `Arc · ${esc(g.id)}${g.parent ? ` · returns to ${esc(g.parent)}` : ''}` : `Chapter ${esc(g.order)} · ${esc(g.title)}${g.years && g.years !== 'none' ? ' · ' + esc(g.years) : ''}`} · ${s.id}</div>
    <h1>${esc(s.label)}</h1></div><span class="chip ${e.status}">${LABEL[e.status]}</span></header>`;
  html += reviewHTML(s, e, review);
  html += `<div class="layer-tabs" role="group" aria-label="Device"><span class="lbl">Version</span><button data-view="desktop" aria-pressed="${viewMode === 'desktop'}">Desktop</button><button data-view="mobile" aria-pressed="${viewMode === 'mobile'}">Mobile</button><span class="note">${viewMode === 'mobile' ? 'Phones show every frame whole, with captions stacked underneath.' : 'Desktop places captions on the frame; they may sit on its edge.'}</span></div>`;
  if (!s.panels.some((p) => p.board)) html += `<div class="empty">${s.status === 'waiting' ? 'Waiting on script edits before this scene can be storyboarded. Fill the <b>[EDIT: …]</b> gaps below in docs/STORY-SCRIPT.md.' : 'Not storyboarded yet.'}</div>`;
  html += s.panels.map((p) => panelHTML(p, s.id, false)).join('');
  const sref = REFS.filter((r) => (r.scenes || []).includes(s.id));
  html += `<section class="panel"><div class="panel-head"><h2>Reference images for this scene</h2><a class="ptype" href="#references">all references →</a></div>${
    sref.length ? `<div class="refs">${sref.map(refHTML).join('')}</div>` : `<p class="note">${NOREF.has(s.id) ? 'None — this scene is built entirely in code.' : 'None listed yet.'}</p>`}</section>`;
  html += `<div class="nav-row"><a class="btn" href="#">← Overview</a><span>${next ? `<a class="btn" href="#${next.id}">Next: ${next.id} →</a>` : ''}</span></div>`;
  view.innerHTML = html;
  view.querySelectorAll('.variants').forEach((v) => {
    const p = findPanel(s, v.dataset.panel);
    let cur = 0, layer = 'all';
    const mobileIdx = p.board.variants.findIndex((x) => /mobile/i.test(x.label || ''));
    const show = (i) => {
      cur = i;
      const box = v.querySelector('.frames'); box.innerHTML = '';
      const variant = p.board.variants[i];
      if (viewMode === 'mobile' && !/mobile/i.test(variant.label || '')) {
        const m = phoneMock(p, variant); box.appendChild(m.el); m.svgs.forEach(fitFrame);
        v.querySelectorAll('[role=tab]').forEach((t) => t.setAttribute('aria-selected', String(Number(t.dataset.v) === i)));
        return;
      }
      for (const [fi, fr] of variant.frames.entries()) {
        const fig = document.createElement('figure');
        const [aw, ah] = fr.aspect.split(':').map(Number);
        fig.className = 'frame' + (ah > aw ? ' tall' : '');
        const svg = renderFrame(fr, p, `${p.id}-${i}-${fi}`, layer);
        fig.appendChild(svg);
        const cap = document.createElement('figcaption'); cap.textContent = `${fr.aspect}${fr.label ? ' · ' + fr.label : ''}`; fig.appendChild(cap);
        box.appendChild(fig);
        fitFrame(svg);
      }
      const rest = leftovers(p, variant);
      if (rest.length && layer !== 'art') { const gtr = capList(rest, 'gutter'); gtr.insertAdjacentHTML('afterbegin', '<span class="lbl">Under the panel</span>'); box.appendChild(gtr); }
      v.querySelectorAll('[role=tab]').forEach((t) => t.setAttribute('aria-selected', String(Number(t.dataset.v) === i)));
    };
    v.querySelectorAll('[role=tab]').forEach((t) => t.addEventListener('click', () => show(Number(t.dataset.v))));
    v.querySelectorAll('[data-layer]').forEach((b) => b.addEventListener('click', () => {
      layer = b.dataset.layer;
      v.querySelectorAll('[data-layer]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      show(cur);
    }));
    show(viewMode === 'mobile' && mobileIdx >= 0 ? mobileIdx : 0);
  });
  view.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => { viewMode = b.dataset.view; const y = scrollY; sceneView(id); scrollTo(0, y); }));
  wireReview(s);
  wirePicker();
}

function findPanel(s, pid) { for (const p of s.panels) { if (p.id === pid) return p; for (const i of p.items || []) if (i.id === pid) return i; } }

function reviewHTML(s, e, review) {
  review = review || null;
  const drafted = s.panels.some((p) => p.board);
  let state = '';
  if (e.source === 'script' && (e.status === 'approved' || e.status === 'revise')) state = `<p class="note">Set in the script (<code>storyboard: ${e.status}</code>).</p>`;
  else if (review && review.status === 'addressed') { state = `<p class="note">Your change request from ${esc(new Date(review.at).toLocaleDateString())} was applied${review.addressedAt ? ' on ' + esc(new Date(review.addressedAt).toLocaleDateString()) : ''}. Review the new version below.</p>${review.note ? `<p class="note">You asked: “${esc(review.note)}”</p>` : ''}${review.reply ? `<p>What changed: ${esc(review.reply)}</p>` : ''}`; review = null; }
  else if (review) state = `<p class="note ${review.hash !== s.hash ? 'warn' : ''}">${review.status === 'approved' ? 'Approved' : 'Changes requested'} here${review.at ? ' on ' + esc(new Date(review.at).toLocaleDateString()) : ''}${review.hash !== s.hash ? ' — the storyboard or script changed since then, so check it again' : ''}. Ask Claude to “sync storyboard reviews” to write this into the script.</p>${review.note ? `<p>“${esc(review.note)}”</p>` : ''}`;
  if (!drafted) return `<div class="review"><strong>Review</strong>${state || '<p class="note">Nothing to review yet.</p>'}</div>`;
  const disabled = dbState !== 'ready' || canWrite === false ? 'disabled' : '';
  const why = dbState === 'ready' && canWrite === false ? `<p class="note">Only the artifact's owner and editors can save reviews.</p>` : dbNote();
  return `<div class="review"><strong>Review this storyboard</strong>${state}
    <label for="review-note" class="note">Notes for Claude (optional — what to change)</label>
    <textarea id="review-note" placeholder="e.g. Move the narration to the bottom; make Reginald smaller in frame 2">${esc(review?.note || '')}</textarea>
    <div class="review-row"><button class="btn primary" id="approve" ${disabled}>Approve storyboard</button><button class="btn" id="revise" ${disabled}>Request changes</button>${review ? `<button class="btn" id="clear" ${disabled}>Clear my review</button>` : ''}<span class="note" id="review-msg" role="status"></span></div>${why}</div>`;
}

let db = null;
function wireReview(s) {
  const msg = document.getElementById('review-msg');
  const save = async (status) => {
    if (!db) return;
    const note = document.getElementById('review-note').value.trim();
    msg.textContent = 'Saving…';
    try {
      await db.collection('reviews').doc(s.id).set({ status, note, hash: s.hash, at: new Date().toISOString() });
      msg.textContent = status === 'approved' ? 'Approved.' : 'Change request saved.';
    } catch (err) { msg.textContent = err && err.code === 'permission_denied' ? 'Only the owner and editors can save reviews.' : 'Couldn’t save. Try again in a moment.'; }
  };
  document.getElementById('approve')?.addEventListener('click', () => save('approved'));
  document.getElementById('revise')?.addEventListener('click', () => save('revise'));
  document.getElementById('clear')?.addEventListener('click', async () => {
    try { await db.collection('reviews').doc(s.id).delete(); msg.textContent = 'Cleared.'; } catch { msg.textContent = 'Couldn’t clear it.'; }
  });
}

function wirePicker() {
  const sel = document.getElementById('scene-picker');
  sel?.addEventListener('change', () => { location.hash = sel.value ? sel.value : ''; if (!sel.value) route(); });
}

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  side.innerHTML = sideHTML();
  side.querySelectorAll('.scene-link').forEach((a) => { if (a.dataset.id === id) { a.setAttribute('aria-current', 'page'); } });
  if (id === 'references') libraryView(); else if (id === 'characters') charactersView(); else if (id === 'photo-scenes') photoScenesView(); else if (id === 'army-photos') armyView(); else if (id && byId[id]) sceneView(id); else overview();
}
window.addEventListener('hashchange', () => { dirty = false; route(); window.scrollTo(0, 0); });
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender && !dirty) rerender(); }, 0));
route();
const cur = side.querySelector('[aria-current="page"]'); if (cur) cur.scrollIntoView({ block: 'center' });

// ---- saved reviews (artifact db) ----------------------------------------
(async () => {
  const timer = setTimeout(() => { if (dbState === 'loading') { dbState = 'slow'; rerender(); } }, 10000);
  try {
    if (!window.claude || !window.claude.use) throw new Error('no viewer');
    db = await window.claude.use('db');
    if (!db) throw new Error('no db');
    const user = await window.claude.use('user');
    canWrite = user ? await user.can('data.write').then((v) => v !== false).catch(() => null) : null;
    if (user) { try { canWrite = (await user.canEdit()) || (await user.isOwner()); } catch { /* keep */ } }
    assetsApi = await window.claude.use('assets').catch(() => null);
    db.collection('images').onSnapshot((snap) => { images = {}; for (const d of snap.docs) if (d.exists) images[d.id] = d.data(); rerender(); }, () => {});
    db.collection('characters').onSnapshot((snap) => { characters = {}; for (const d of snap.docs) if (d.exists) characters[d.id] = d.data(); rerender(); }, () => {});
    db.collection('reviews').onSnapshot((snap) => {
      reviews = {}; for (const d of snap.docs) if (d.exists) reviews[d.id] = d.data();
      if (!snap.metadata.fromCache) { clearTimeout(timer); dbState = 'ready'; } else if (dbState === 'loading') dbState = 'ready';
      rerender();
    }, () => { clearTimeout(timer); dbState = 'unavailable'; rerender(); });
  } catch { clearTimeout(timer); dbState = 'unavailable'; rerender(); }
})();

function rerender() {
  const ae = document.activeElement;
  if (dirty || (ae && view.contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && ae.id !== 'review-note')) { pendingRender = true; return; }
  pendingRender = false;
  const note = document.getElementById('review-note');
  const draft = note ? note.value : null, focused = document.activeElement === note;
  const y = window.scrollY;
  route();
  const n2 = document.getElementById('review-note');
  if (n2 && draft !== null) { n2.value = draft; if (focused) n2.focus(); }
  window.scrollTo(0, y);
}
</script>
